<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKBUDDY PRO · 班级管理系统</title>
  
  <!-- ===== 外部依赖 ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <style>
    /* ================================================================
       全局样式（完整保留）
       ================================================================ */
    :root {
      --primary: #6d5dfc; --primary-light: #8a7fff; --primary-dark: #4f3df0;
      --secondary: #00d4ff; --bg-base: #0f172a; --bg-card: rgba(255,255,255,0.06);
      --bg-card-hover: rgba(255,255,255,0.1); --text-main: #e2e8f0; --text-secondary: #94a3b8;
      --border-glow: rgba(109,93,252,0.4); --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
      --radius: 16px; --shadow: 0 8px 32px rgba(0,0,0,0.3); --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter','Segoe UI',system-ui,sans-serif; background: var(--bg-base); color: var(--text-main); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    
    body::before { content:''; position:fixed; top:0; left:0; width:100%; height:100%; background-image: radial-gradient(circle at 20% 50%, rgba(109,93,252,0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(0,212,255,0.1) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(255,255,255,0.05) 0%, transparent 50%); pointer-events:none; z-index:-2; }
    body::after { content:''; position:fixed; top:0; left:0; width:100%; height:100%; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size:40px 40px; pointer-events:none; z-index:-1; }
    
    #auth-container { display:flex; justify-content:center; align-items:center; min-height:100vh; background: radial-gradient(ellipse at center, #1e1b4b 0%, #0f172a 100%); position:relative; z-index:1; }
    .auth-card { background:var(--bg-card); backdrop-filter:blur(20px); border:1px solid var(--border-glow); border-radius:20px; box-shadow:var(--shadow),0 0 30px rgba(109,93,252,0.2); padding:40px; width:100%; max-width:420px; animation:fadeInUp 0.6s ease-out; }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    .auth-card h2 { text-align:center; margin-bottom:10px; color:#fff; font-size:28px; font-weight:700; letter-spacing:1px; text-shadow:0 0 20px rgba(109,93,252,0.8); }
    .auth-card .subtitle { text-align:center; color:var(--text-secondary); margin-bottom:30px; font-size:14px; }
    .auth-tabs { display:flex; gap:10px; margin-bottom:25px; background:rgba(255,255,255,0.05); padding:4px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); }
    .auth-tabs button { flex:1; padding:10px; border:none; background:transparent; border-radius:8px; font-weight:500; transition:var(--transition); color:var(--text-secondary); font-size:14px; }
    .auth-tabs button.active { background:var(--primary); color:white; box-shadow:0 0 15px rgba(109,93,252,0.5); }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block; margin-bottom:6px; font-weight:500; color:var(--text-main); font-size:14px; }
    .form-group input { width:100%; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:8px; font-size:15px; color:#fff; transition:var(--transition); }
    .form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(109,93,252,0.2); background:rgba(255,255,255,0.08); }
    .btn-primary { width:100%; padding:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; transition:var(--transition); letter-spacing:1px; }
    .btn-primary:hover { box-shadow:0 0 25px rgba(109,93,252,0.6); transform:translateY(-2px); }
    .error-message { color:var(--danger); text-align:center; margin-top:15px; min-height:20px; font-size:14px; }

    #main-container { display:flex; min-height:100vh; }
    .sidebar { width:250px; background:rgba(15,23,42,0.8); backdrop-filter:blur(20px); border-right:1px solid rgba(255,255,255,0.1); color:white; padding:20px 0; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:100; }
    .sidebar-logo { text-align:center; padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:15px; cursor:pointer; }
    .sidebar-logo h1 { font-size:18px; font-weight:700; background:linear-gradient(135deg,#fff,#a5b4fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sidebar-logo .badge { font-size:10px; background:rgba(109,93,252,0.3); padding:2px 10px; border-radius:12px; display:inline-block; margin-top:3px; color:#c7d2fe; }
    .nav-links { flex:1; padding:0 12px; overflow-y:auto; }
    .nav-group { margin-bottom:8px; }
    .nav-group-title { display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; padding:8px 10px; cursor:pointer; border-radius:6px; transition:var(--transition); user-select:none; }
    .nav-group-title:hover { background:rgba(255,255,255,0.05); color:#fff; }
    .nav-group-title .fa-chevron-down { transition:transform 0.3s; }
    .nav-group.collapsed .nav-group-title .fa-chevron-down { transform:rotate(-90deg); }
    .nav-group-body { max-height:500px; overflow:hidden; transition:max-height 0.4s ease; }
    .nav-group.collapsed .nav-group-body { max-height:0; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:9px 15px; margin-bottom:3px; border-radius:8px; color:rgba(255,255,255,0.7); transition:var(--transition); cursor:pointer; font-weight:500; font-size:13px; }
    .nav-item:hover { background:rgba(255,255,255,0.08); color:#fff; }
    .nav-item.active { background:linear-gradient(135deg,rgba(109,93,252,0.3),rgba(0,212,255,0.2)); color:#fff; box-shadow:0 0 15px rgba(109,93,252,0.3); }
    .nav-item i { width:20px; text-align:center; font-size:14px; }
    .sidebar-footer { padding:15px 20px; border-top:1px solid rgba(255,255,255,0.1); }
    .user-profile { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .user-avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px; }
    .user-details { flex:1; }
    .user-details .name { font-weight:600; font-size:13px; }
    .user-details .role { font-size:11px; opacity:0.7; }
    .btn-logout { width:100%; padding:9px; background:rgba(255,255,255,0.08); color:#fff; border:none; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:8px; transition:var(--transition); font-size:13px; }
    .btn-logout:hover { background:rgba(239,68,68,0.2); }

    .main-content { flex:1; margin-left:250px; padding:20px 25px; }
    .page-header { margin-bottom:20px; }
    .page-header h2 { font-size:24px; color:#fff; font-weight:700; }
    .page-header .breadcrumb { color:var(--text-secondary); font-size:13px; margin-top:3px; }

    .banner { position:relative; height:170px; border-radius:var(--radius); background:linear-gradient(135deg,#1e1b4b 0%,#4f3df0 50%,#00d4ff 100%); background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:20px; margin-bottom:20px; box-shadow:var(--shadow),0 0 30px rgba(109,93,252,0.3); overflow:hidden; }
    .banner::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.6),transparent); }
    .banner-content { position:relative; z-index:2; color:#fff; flex:1; }
    .banner-content h3 { font-size:22px; font-weight:700; text-shadow:0 2px 10px rgba(0,0,0,0.5); }
    .banner-content p { font-size:13px; opacity:0.9; }
    .banner-upload { position:absolute; top:15px; right:15px; z-index:3; background:rgba(0,0,0,0.5); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; transition:var(--transition); }
    .banner-upload:hover { background:rgba(109,93,252,0.8); transform:scale(1.1); }
    .banner-info { position:absolute; top:15px; right:65px; z-index:3; background:rgba(0,0,0,0.4); border-radius:10px; padding:8px 12px; color:#fff; font-size:12px; text-align:right; }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-bottom:20px; }
    .stat-card { background:var(--bg-card); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:flex; align-items:center; gap:13px; transition:var(--transition); cursor:pointer; }
    .stat-card:hover { transform:translateY(-3px); background:var(--bg-card-hover); }
    .stat-icon { width:45px; height:45px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; color:white; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); }
    .stat-icon.green { background:linear-gradient(135deg,#10b981,#059669); }
    .stat-icon.orange { background:linear-gradient(135deg,#f59e0b,#d97706); }
    .stat-icon.red { background:linear-gradient(135deg,#ef4444,#dc2626); }
    .stat-info h4 { font-size:20px; font-weight:700; color:#fff; }
    .stat-info p { color:var(--text-secondary); font-size:12px; }

    .card { background:var(--bg-card); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:15px; transition:var(--transition); }
    .card:hover { border-color:rgba(255,255,255,0.2); background:var(--bg-card-hover); }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
    .card-header h3 { font-size:15px; color:#fff; font-weight:600; }

    .table-responsive { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px 11px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.08); font-size:12px; }
    th { background:rgba(255,255,255,0.03); color:var(--text-secondary); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
    tr:hover { background:rgba(255,255,255,0.03); }

    .badge { padding:3px 8px; border-radius:15px; font-size:10px; font-weight:600; }
    .badge-success { background:rgba(16,185,129,0.2); color:#6ee7b7; }
    .badge-danger { background:rgba(239,68,68,0.2); color:#fca5a5; }
    .badge-warning { background:rgba(245,158,11,0.2); color:#fcd34d; }
    .badge-info { background:rgba(109,93,252,0.2); color:#c7d2fe; }

    .btn { padding:7px 13px; border:none; border-radius:8px; font-size:12px; font-weight:500; transition:var(--transition); display:inline-flex; align-items:center; gap:5px; }
    .btn-sm { padding:4px 8px; font-size:10px; }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; box-shadow:0 4px 15px rgba(109,93,252,0.4); }
    .btn-primary:hover { box-shadow:0 6px 25px rgba(109,93,252,0.6); transform:translateY(-2px); }
    .btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
    .btn-outline { background:transparent; border:1px solid rgba(255,255,255,0.3); color:var(--text-main); }
    .btn-outline:hover { background:rgba(255,255,255,0.1); }
    .btn-success { background:linear-gradient(135deg,#10b981,#059669); color:white; }

    .form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .form-row input,.form-row select,.form-row textarea { padding:8px 11px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:8px; font-size:12px; color:#fff; transition:var(--transition); flex:1; min-width:120px; }
    .form-row input:focus,.form-row select:focus,.form-row textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(109,93,252,0.2); }
    .form-row select option { background:#1e293b; color:#e2e8f0; }
    .form-row input::placeholder,.form-row textarea::placeholder { color:#64748b; }

    .empty-state { text-align:center; padding:25px; color:var(--text-secondary); }
    .empty-state i { font-size:35px; margin-bottom:8px; opacity:0.5; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; animation:fadeIn 0.2s ease; }
    .modal-content { background:#1e293b; border-radius:16px; padding:20px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
    .modal-content h3 { color:#fff; margin-bottom:15px; }
    .modal-actions { margin-top:15px; display:flex; gap:10px; justify-content:flex-end; }

    .toast-container { position:fixed; top:20px; right:20px; z-index:2000; display:flex; flex-direction:column; gap:10px; }
    .toast { padding:10px 15px; border-radius:8px; color:#fff; font-weight:500; box-shadow:0 4px 15px rgba(0,0,0,0.3); animation:slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards; }
    .toast.success { background:#10b981; } .toast.error { background:#ef4444; } .toast.warning { background:#f59e0b; }
    @keyframes slideIn { from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;} }
    @keyframes fadeOut { to{opacity:0; transform:translateX(100%);} }

    .seat-grid-wrapper { overflow-x:auto; padding:10px 0; }
    .seat-row { display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
    .seat-group { display:flex; gap:4px; }
    .seat-group-divider { width:25px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); font-size:9px; letter-spacing:1px; flex-shrink:0; }
    .seat-item { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:8px; text-align:center; cursor:pointer; transition:var(--transition); position:relative; min-width:70px; }
    .seat-item:hover { background:rgba(255,255,255,0.1); transform:translateY(-2px); }
    .seat-item.empty { background:rgba(255,255,255,0.02); border-style:dashed; cursor:default; }
    .seat-item.empty:hover { transform:none; background:rgba(255,255,255,0.02); }
    .seat-item .seat-name { font-weight:600; font-size:12px; }
    .seat-item .seat-number { font-size:9px; color:var(--text-secondary); }
    .seat-item .gender-badge { position:absolute; top:4px; right:4px; font-size:9px; }
    .seat-item.male { border-left:3px solid #3b82f6; }
    .seat-item.female { border-left:3px solid #ec4899; }
    .seat-item.selected { border-color:var(--primary); box-shadow:0 0 15px rgba(109,93,252,0.5); }

    .rollcall-display-box { font-size:52px; font-weight:800; margin:15px 0; color:#fff; text-shadow:0 0 30px rgba(109,93,252,0.8); letter-spacing:2px; min-height:80px; display:flex; align-items:center; justify-content:center; }
    .rollcall-display-box.rolling { animation:pulse 0.2s ease infinite alternate; }
    @keyframes pulse { from{transform:scale(1);} to{transform:scale(1.05);} }

    .homework-card { background:var(--bg-card); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px; margin-bottom:10px; cursor:pointer; transition:var(--transition); }
    .homework-card:hover { background:var(--bg-card-hover); transform:translateY(-2px); box-shadow:var(--shadow); }
    .homework-card .hw-subject { font-size:12px; font-weight:600; color:var(--primary-light); }
    .homework-card .hw-title { font-size:14px; font-weight:600; color:#fff; }
    .homework-card .hw-meta { font-size:11px; color:var(--text-secondary); }

    .post-card { background:var(--bg-card); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; transition:var(--transition); }
    .post-card:hover { background:var(--bg-card-hover); transform:translateY(-2px); }
    .post-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .post-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; }
    .post-media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; margin-top:8px; }
    .post-media-grid img { width:100%; border-radius:6px; object-fit:cover; }

    .avatar-wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:12px; }
    .avatar-item { text-align:center; cursor:pointer; transition:var(--transition); }
    .avatar-item:hover { transform:scale(1.1); }
    .avatar-circle { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; color:#fff; margin:0 auto 5px; }

    .schedule-block { border-radius:6px; padding:4px 6px; margin:2px 0; cursor:pointer; transition:var(--transition); }
    .schedule-block:hover { transform:scale(1.03); box-shadow:0 0 10px rgba(0,0,0,0.3); }
    .schedule-subject { font-weight:600; font-size:11px; }
    .schedule-teacher { font-size:9px; opacity:0.8; }
    .schedule-time { font-size:9px; color:var(--text-secondary); }

    .task-column { min-height:150px; padding:5px; border-radius:8px; background:rgba(255,255,255,0.02); }
    .task-item { background:var(--bg-card); padding:10px; border-radius:8px; margin-bottom:8px; cursor:grab; transition:var(--transition); }
    .task-item:hover { background:var(--bg-card-hover); }

    .notification-bell { position:fixed; top:20px; right:20px; z-index:999; background:rgba(15,23,42,0.8); backdrop-filter:blur(10px); border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; border:1px solid rgba(255,255,255,0.1); transition:var(--transition); }
    .notification-bell:hover { background:rgba(109,93,252,0.4); transform:scale(1.05); }
    .notification-badge { position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; border-radius:50%; width:20px; height:20px; font-size:10px; display:flex; align-items:center; justify-content:center; }

    @media (max-width:768px) {
      .sidebar { width:60px; padding:15px 0; }
      .sidebar-logo h1,.sidebar-logo .badge,.user-details,.nav-item span,.nav-group-title span { display:none; }
      .nav-group-title { justify-content:center; padding:8px; }
      .nav-group-body { max-height:0 !important; }
      .nav-item { justify-content:center; padding:10px; }
      .nav-item i { margin:0; font-size:16px; }
      .main-content { margin-left:60px; padding:12px; }
      .banner { height:130px; }
      .rollcall-display-box { font-size:32px; }
      .modal-content { padding:14px; max-width:95%; }
      .stats-grid { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:480px) {
      .stats-grid { grid-template-columns:1fr; }
      .form-row { flex-direction:column; align-items:stretch; }
      .form-row input, .form-row select { min-width:auto; }
    }
  </style>
</head>
<body>
  <!-- 通知铃铛 -->
  <div class="notification-bell" id="notification-bell" onclick="switchPage('notifications')">
    <i class="fa-solid fa-bell"></i>
    <span class="notification-badge" id="notification-badge" style="display:none;">0</span>
  </div>

  <!-- 认证容器 -->
  <div id="auth-container">
    <div class="auth-card">
      <h2><i class="fa-solid fa-graduation-cap"></i> WORKBUDDY PRO</h2>
      <p class="subtitle">班级管理系统 · 云端版</p>
      <div class="auth-tabs">
        <button id="login-tab" class="active">登录</button>
        <button id="signup-tab">注册</button>
      </div>
      <form id="auth-form">
        <div class="form-group"><label>用户名</label><input type="text" id="username" required placeholder="请输入用户名"></div>
        <div class="form-group" id="realname-group" style="display:none;"><label>真实姓名</label><input type="text" id="realname" placeholder="请输入真实姓名"></div>
        <div class="form-group"><label>密码</label><input type="password" id="password" required minlength="6" placeholder="至少6位密码"></div>
        <button type="submit" class="btn-primary" id="auth-submit-btn">登 录</button>
      </form>
      <p id="auth-message" class="error-message"></p>
    </div>
  </div>

  <!-- 主容器 -->
  <div id="main-container" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-logo" id="logo-home"><h1>WORKBUDDY</h1><span class="badge">PRO 云端版</span></div>
      <nav class="nav-links" id="nav-links"></nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="user-avatar-letter">A</div>
          <div class="user-details">
            <div class="name" id="sidebar-username">用户名</div>
            <div class="role" id="sidebar-role">角色</div>
          </div>

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      return lines.map(line => {
        const result = []; let current = ''; let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') inQuotes = !inQuotes;
          else if (c === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
          else current += c;
        }
        result.push(current.trim()); return result;
      });
    }
    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(new File([blob], 'compressed.jpg', { type: 'image/jpeg' })), 'image/jpeg', quality);
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }

    async function callAI(type, payload) {
      let cacheKey = null;
      if (type === 'comment' && payload.id) {
        cacheKey = `comment_${payload.id}`;
      } else if (type === 'analysis' && payload.id) {
        cacheKey = `analysis_${payload.id}`;
      } else if (type === 'class_summary') {
        cacheKey = `class_summary_${AppState.currentProfile.class_id}`;
      } else if (type === 'exam_analysis') {
        cacheKey = `exam_analysis_${Date.now()}`;
      } else {
        cacheKey = `${type}_${Date.now()}`;
      }

      if (cacheKey && !cacheKey.includes('Date.now')) {
        const { data: cached } = await supabase.from('ai_reports')
          .select('content, created_at')
          .eq('report_key', cacheKey)
          .maybeSingle();
        if (cached) {
          const age = Date.now() - new Date(cached.created_at).getTime();
          if (age < 24 * 60 * 60 * 1000) {
            console.log(`AI 缓存命中: ${cacheKey}`);
            return cached.content;
          }
        }
      }

      try {
        const response = await fetch(AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, payload })
        });
        if (!response.ok) {
          const err = await response.json().catch(() => ({ error: '请求失败' }));
          throw new Error(err.error || 'AI 调用失败');
        }
        const result = await response.json();
        const content = result.content;
        if (content && cacheKey && !cacheKey.includes('Date.now')) {
          await supabase.from('ai_reports').upsert({
            class_id: AppState.currentProfile.class_id,
            report_key: cacheKey,
            content: content,
            created_at: new Date().toISOString(),
            type: type,
            payload: payload
          }, { onConflict: 'report_key' });
        }
        return content;
      } catch (error) {
        console.error('AI 调用错误:', error);
        showToast('AI 服务不可用：' + error.message, 'error');
        return null;
      }
    }

    async function refreshDashboardData(classId, today, month) {
      const [studentsRes, attendTodayRes, homeworkRes, examsRes, activitiesRes, teamRes] = await Promise.all([
        supabase.from('students').select('id').eq('class_id', classId),
        supabase.from('attendance').select('status').eq('class_id', classId).eq('date', today),
        supabase.from('homework').select('due_date').eq('class_id', classId),
        supabase.from('exam_scores').select('score').eq('class_id', classId),
        supabase.from('activity_logs').select('*').eq('class_id', classId).order('created_at', { ascending: false }).limit(10),
        supabase.from('students').select('name,role').eq('class_id', classId).neq('role', '').neq('role', null)
      ]);

      const total = studentsRes.data ? studentsRes.data.length : 0;
      const present = attendTodayRes.data ? attendTodayRes.data.filter(a => a.status === 'present').length : 0;
      const rate = total ? Math.round(present/total*100) : 0;
      const pending = homeworkRes.data ? homeworkRes.data.filter(h => h.due_date >= today).length : 0;
      let avgScore = '--';
      if (examsRes.data && examsRes.data.length) {

        if (scores.length) avgScore = (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);
      }
      return { total, rate, pending, avgScore, activities: activitiesRes.data || [], team: teamRes.data || [] };

    window.importStudents = function() {
      const input = document.createElement('input'); input.type = 'file'; input.accept = '.csv,.xlsx,.xls';
      input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        try {
          let data;
          if (file.name.endsWith('.csv')) {
            const text = await file.text();
            const rows = parseCSV(text);
            const headers = rows[0].map(h => h.trim());
            data = rows.slice(1).map(row => {
              const obj = {};
              headers.forEach((h, idx) => { obj[h] = row[idx] || ''; });
              return obj;
            });
          } else {
            const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            data = XLSX.utils.sheet_to_json(ws);
          }
          const mapped = data.map(row => ({
            class_id: AppState.currentProfile.class_id,
            name: row['姓名'] || row['name'] || '',
            student_no: row['学号'] || row['student_no'] || '',
            gender: row['性别'] || row['gender'] || '',
            ethnicity: row['族别'] || row['ethnicity'] || '',
            seat: row['座位'] || row['seat'] || '',
            role: row['职务'] || row['role'] || '',
            parent_name: row['家长姓名'] || row['parent_name'] || '',
            parent_phone: row['家长电话'] || row['parent_phone'] || '',
            address: row['住址'] || row['address'] || ''
          })).filter(s => s.name);
          if (mapped.length === 0) { showToast('未识别到有效数据', 'error'); return; }
          const { error } = await supabase.from('students').insert(mapped);
          if (error) { showToast('导入失败：' + error.message, 'error'); return; }
          showToast(`成功导入 ${mapped.length} 名学生`);
          loadStudents();
          logActivity('导入学生', `导入 ${mapped.length} 人`);
        } catch (err) { showToast('导入失败：'+err.message, 'error'); }
      };
      input.click();
    };

    async function loadSeating() {
      const container = document.getElementById('page-seating');
      const { data: students } = await supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id).order('seat', { ascending: true });
      AppState.allStudents = students || [];
      container.innerHTML = `

        <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="autoArrangeSeats()"><i class="fa-solid fa-shuffle"></i> 自动排座</button>

      `;

    function renderSeats() {
      const container = document.getElementById('seat-grid');
      const students = AppState.allStudents;
      const sorted = [...students].sort((a,b) => (a.seat || '0-0').localeCompare(b.seat || '0-0'));
      let html = '<div class="seat-grid-wrapper"><div style="text-align:center;color:var(--text-secondary);font-size:12px;margin-bottom:8px;">📌 讲台</div>';
      const rows = 8, cols = 8;
      for (let r = 0; r < rows; r++) {
        html += `<div class="seat-row">`;
        for (let c = 0; c < cols; c++) {
          if (c === 2 || c === 4 || c === 6) html += `<div class="seat-group-divider">|</div>`;
          const seatKey = `${r+1}-${c+1}`;
          const student = sorted.find(s => s.seat === seatKey);
          html += `<div class="seat-item ${student ? (student.gender === '男' ? 'male' : 'female') : 'empty'}" data-seat="${seatKey}" onclick="selectSeat('${seatKey}')">`;
          if (student) {
            html += `<div class="seat-name">${escapeHtml(student.name)}</div><div class="seat-number">${seatKey}</div>`;
            if (student.role) html += `<div style="font-size:8px;color:var(--primary-light);">${escapeHtml(student.role)}</div>`;
          } else {
            html += `<div class="seat-name" style="color:var(--text-secondary);">空</div><div class="seat-number">${seatKey}</div>`;
          }
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    let selectedSeat = null;
    window.selectSeat = function(seatKey) {
      if (selectedSeat === null) { selectedSeat = seatKey; document.querySelector(`[data-seat="${seatKey}"]`)?.classList.add('selected'); return; }
      const s1 = AppState.allStudents.find(s => s.seat === selectedSeat);
      const s2 = AppState.allStudents.find(s => s.seat === seatKey);
      if (!s1 && !s2) { showToast('至少选择一个有学生的座位', 'warning'); selectedSeat = null; document.querySelectorAll('.seat-item.selected').forEach(el => el.classList.remove('selected')); return; }
      const seat1 = s1 ? s1.seat : null;
      const seat2 = s2 ? s2.seat : null;
      const updates = [];
      if (s1) { s1.seat = seat2; updates.push(supabase.from('students').update({ seat: seat2 }).eq('id', s1.id)); }
      if (s2) { s2.seat = seat1; updates.push(supabase.from('students').update({ seat: seat1 }).eq('id', s2.id)); }
      Promise.all(updates).then(async () => {
        showToast('座位交换成功');
        selectedSeat = null;
        document.querySelectorAll('.seat-item.selected').forEach(el => el.classList.remove('selected'));
        const { data: freshStudents } = await supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id);
        AppState.allStudents = freshStudents || [];
        renderSeats();
        if (document.getElementById('page-students').style.display !== 'none') loadStudents();
      }).catch(err => showToast('交换失败', 'error'));
    };

    window.autoArrangeSeats = function() {
      if (!confirm('将随机打乱所有学生座位，继续？')) return;
      const students = AppState.allStudents;
      if (students.length === 0) { showToast('暂无学生', 'warning'); return; }
      const seats = [];
      for (let r=1; r<=8; r++) for (let c=1; c<=8; c++) seats.push(`${r}-${c}`);
      const shuffled = [...students].sort(() => Math.random() - 0.5);
      const updates = shuffled.map((s, idx) => {
        const seat = seats[idx % seats.length];
        return supabase.from('students').update({ seat }).eq('id', s.id);
      });
      Promise.all(updates).then(async () => {
        showToast('排座完成');
        const { data: freshStudents } = await supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id);
        AppState.allStudents = freshStudents || [];
        renderSeats();
        if (document.getElementById('page-students').style.display !== 'none') loadStudents();
      }).catch(err => showToast('排座失败：'+err.message, 'error'));
    };

    window.clearSeats = function() {
      if (!confirm('清空所有学生座位？')) return;
      const updates = AppState.allStudents.map(s => supabase.from('students').update({ seat: null }).eq('id', s.id));
      Promise.all(updates).then(async () => {
        showToast('已清空座位');
        const { data: freshStudents } = await supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id);
        AppState.allStudents = freshStudents || [];
        renderSeats();
      });
    };

    function renderRollHistory() {

    window.startRoll = function() {
      const display = document.getElementById('rollcall-display');
      const exclude = document.getElementById('exclude-called')?.checked || false;
      let available = AppState.allStudents;
      if (exclude) { available = available.filter(s => !rollCalled.includes(s.id)); }
      if (available.length === 0) { showToast('没有可点名的学生', 'warning'); return; }
      display.classList.add('rolling');
      rollCallTimer = setInterval(() => {
        const rand = available[Math.floor(Math.random() * available.length)];
        display.textContent = rand.name;
      }, 100);
    };

    window.stopRoll = function() {
      if (rollCallTimer) { clearInterval(rollCallTimer); rollCallTimer = null; }
      const display = document.getElementById('rollcall-display');
      display.classList.remove('rolling');
      const name = display.textContent;
      if (name && name !== '准备') {
        const student = AppState.allStudents.find(s => s.name === name);
        if (student && !rollCalled.includes(student.id)) {
          rollCalled.push(student.id);
          supabase.from('rollcall_history').insert({ 
            class_id: AppState.currentProfile.class_id, 
            student_id: student.id, 
            date: new Date().toISOString().split('T')[0] 
          }).then(() => {
            renderRollHistory();
            document.querySelector('.page-header .breadcrumb').textContent = `已点 ${rollCalled.length} / ${AppState.allStudents.length}`;
          });
          showToast(`点到：${name}`, 'success');
        } else if (student) {
          showToast(`${name} 已点过，请继续抽取`, 'warning');
        }
      }
    };

    window.resetRoll = function() {
      if (rollCallTimer) { clearInterval(rollCallTimer); rollCallTimer = null; }
      rollCalled = [];
      document.getElementById('rollcall-display').textContent = '准备';
      document.getElementById('rollcall-display').classList.remove('rolling');
      document.getElementById('roll-history').innerHTML = '';
      document.querySelector('.page-header .breadcrumb').textContent = `已点 0 / ${AppState.allStudents.length}`;
      loadRollcall();
    };

    async function loadHomework() {
      const container = document.getElementById('page-homework');
      const { data } = await supabase.from('homework').select('*').eq('class_id', AppState.currentProfile.class_id).order('created_at', { ascending: false });
      AppState.homeworkList = data || [];
      const total = AppState.homeworkList.length;

      const week = AppState.homeworkList.filter(h => h.due_date >= today).length;
      let submitRate = 0, totalUnsubmitted = 0;
      if (total > 0) {
        const { data: submits } = await supabase.from('homework_submissions').select('*').eq('class_id', AppState.currentProfile.class_id);
        const totalStudents = AppState.allStudents.length;
        if (totalStudents > 0) {
          const submitted = submits ? submits.filter(s => s.submitted).length : 0;
          submitRate = Math.round(submitted / (total * totalStudents) * 100);
        }
        const unsub = submits ? submits.filter(s => !s.submitted) : [];
        totalUnsubmitted = unsub.length;
      }
      const subjects = [...new Set(AppState.homeworkList.map(h => h.subject))];
      container.innerHTML = `
        <div class="page-header"><h2>📚 作业管理</h2><div class="breadcrumb">共 ${total} 份作业</div></div>
        <div class="stats-grid">
          <div class="stat-card" onclick="filterHomework('all')"><div class="stat-icon"><i class="fa-solid fa-book"></i></div><div class="stat-info"><h4>${total}</h4><p>总作业数</p></div></div>

    function renderHomeworkList(list) {
      const container = document.getElementById('homework-list');
      if (!list || list.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-file-lines"></i><p>暂无作业</p></div>'; return; }
      const today = new Date().toISOString().split('T')[0];
      container.innerHTML = list.map(h => {
        const days = Math.ceil((new Date(h.due_date) - new Date())/(1000*60*60*24));
        const badge = days < 0 ? '<span class="badge badge-danger">已逾期</span>' : days <= 3 ? `<span class="badge badge-warning">剩余${days}天</span>` : `<span class="badge badge-success">剩余${days}天</span>`;
        return `
          <div class="homework-card" onclick="showHomeworkDetail('${h.id}')">
            <div class="hw-subject">${escapeHtml(h.subject)}</div>
            <div class="hw-title">${escapeHtml(h.title)}</div>

          </div>
        `;
      }).join('');

    window.filterHomework = function(filter, subject) {
      let list = AppState.homeworkList;
      if (filter === 'week') {
        const today = new Date().toISOString().split('T')[0];
        list = list.filter(h => h.due_date >= today);
      } else if (filter === 'subject' && subject) {
        list = list.filter(h => h.subject === subject);
      }
      renderHomeworkList(list);
    };

    window.loadScores = async function(examId) {
      AppState.selectedExamId = examId;
      const { data: scores } = await supabase.from('exam_scores').select('*, students(name)').eq('exam_id', examId);
      currentScores = scores || [];
      const students = AppState.allStudents;
      const subjects = ['语文','数学','英语','物理','化学','生物','政治','历史','地理'];
      const container = document.getElementById('score-entry');
      container.style.display = 'block';
      const isMobile = window.innerWidth < 768 || _forceMobile;
      let html = `<div class="card"><div class="card-header"><h3>录入成绩</h3>
        <button class="btn btn-primary btn-sm" onclick="saveScores('${examId}')"><i class="fa-solid fa-save"></i> 保存</button>
        ${isMobile ? '<button class="btn btn-outline btn-sm" onclick="toggleScoreView()"><i class="fa-solid fa-table-cells"></i> 切换视图</button>' : ''}
      </div>`;

      if (!isMobile) {
        html += `<div class="table-responsive"><table><thead><tr><th>姓名</th>`;
        subjects.forEach(s => html += `<th>${s}</th>`);
        html += '</tr></thead><tbody>';
        students.forEach(stu => {
          html += `<tr><td><span style="cursor:pointer;color:var(--primary-light);" onclick="switchPageWithStudent('analysis','${stu.id}')">${escapeHtml(stu.name)}</span></td>`;
          subjects.forEach(sub => {
            const score = currentScores.find(s => s.student_id === stu.id && s.subject === sub);
            html += `<td><input type="number" step="0.5" class="score-input" data-student="${stu.id}" data-subject="${sub}" value="${score ? score.score : ''}" style="width:60px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;padding:4px;"></td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      } else {
        html += `<div id="score-card-view">`;
        students.forEach(stu => {
          html += `<div style="background:var(--bg-card);border-radius:8px;padding:10px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.1);">
            <div style="font-weight:600;margin-bottom:6px;color:var(--primary-light);">${escapeHtml(stu.name)}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">`;
          subjects.forEach(sub => {
            const score = currentScores.find(s => s.student_id === stu.id && s.subject === sub);
            html += `<div><span style="font-size:11px;color:var(--text-secondary);">${sub}</span>
              <input type="number" step="0.5" class="score-input" data-student="${stu.id}" data-subject="${sub}" value="${score ? score.score : ''}" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;padding:4px;font-size:12px;"></div>`;
          });
          html += '</div></div>';
        });
        html += '</div>';
      }

      container.innerHTML = html;
      const stats = subjects.map(sub => {
        const scores = currentScores.filter(s => s.subject === sub).map(s => s.score).filter(s => s !== null && s !== '');
        const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '--';
        const pass = scores.filter(s => s >= 60).length;
        const rate = scores.length ? (pass/scores.length*100).toFixed(1) : '--';
        return `<span class="badge badge-info" style="margin:2px;">${sub} 均分${avg} 及格${rate}%</span>`;
      }).join('');
      container.innerHTML += `<div style="margin-top:10px;">${stats}</div>`;
    };

    window.toggleScoreView = function() {
      _forceMobile = !_forceMobile;
      if (AppState.selectedExamId) loadScores(AppState.selectedExamId);
    };

    window.saveScores = async function(examId) {
      const inputs = document.querySelectorAll('.score-input');
      const updates = [];
      inputs.forEach(input => {
        const studentId = input.dataset.student;
        const subject = input.dataset.subject;
        const score = parseFloat(input.value);
        if (isNaN(score)) return;
        updates.push(supabase.from('exam_scores').upsert({
          exam_id: examId, student_id: studentId, subject, score,
          class_id: AppState.currentProfile.class_id
        }, { onConflict: 'exam_id,student_id,subject' }));
      });
      if (updates.length === 0) { showToast('没有有效分数', 'warning'); return; }
      await Promise.all(updates);
      showToast('成绩已保存');
      loadScores(examId);
    };

    window.deleteExam = async function(id) {
      if (!confirm('删除考试及其所有成绩？')) return;
      await supabase.from('exam_scores').delete().eq('exam_id', id);
      await supabase.from('exams').delete().eq('id', id);
      showToast('已删除');
      loadGrades();
    };

    window.importGrades = function() {
      const input = document.createElement('input'); input.type = 'file'; input.accept = '.xlsx,.xls';
      input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        try {
          const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);
          const students = AppState.allStudents;
          const updates = [];
          rows.forEach(row => {
            const name = row['姓名'] || row['name'] || '';
            const stu = students.find(s => s.name === name);
            if (!stu) return;
            Object.keys(row).forEach(key => {
              if (key === '姓名' || key === 'name') return;
              const score = parseFloat(row[key]);
              if (isNaN(score)) return;
              updates.push(supabase.from('exam_scores').upsert({
                exam_id: AppState.selectedExamId, student_id: stu.id, subject: key, score,
                class_id: AppState.currentProfile.class_id
              }, { onConflict: 'exam_id,student_id,subject' }));
            });
          });
          await Promise.all(updates);
          showToast('成绩导入成功');
          loadScores(AppState.selectedExamId);
        } catch (err) { showToast('导入失败', 'error'); }
      };
      input.click();
    };

    window.uploadExamPaper = async function() {
      const textarea = document.getElementById('paper-content');
      const fileInput = document.getElementById('paper-file');
      let content = textarea.value.trim();
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        content = await new Promise((resolve) => {
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsText(file);
        });
        textarea.value = content;
      }
      if (!content) { showToast('请粘贴试卷内容或上传文件', 'error'); return; }
      const result = await callAI('exam_analysis', { content });
      if (result) {
        document.getElementById('paper-analysis-result').innerHTML = `
          <div class="card" style="background:rgba(16,185,129,0.1);border-color:var(--success);">
            <h4 style="color:var(--success);">📊 分析结果</h4>
            <div style="white-space:pre-wrap;font-size:14px;">${escapeHtml(result)}</div>
          </div>
        `;
        showToast('分析完成', 'success');

    };

    window.confirmAddSchedule = async function(id) {
      const subject = document.getElementById('sche-subject').value.trim();
      const teacher = document.getElementById('sche-teacher').value.trim();
      const day = document.getElementById('sche-day').value;
      const period = parseInt(document.getElementById('sche-period').value);
      const week = document.getElementById('sche-week').value || null;
      if (!subject) { showToast('科目不能为空', 'error'); return; }
      const data = { class_id: AppState.currentProfile.class_id, subject, teacher, day, period, week };
      let error;
      if (id) {
        const r = await supabase.from('schedule').update(data).eq('id', id);
        error = r.error;
      } else {
        const r = await supabase.from('schedule').insert(data);
        error = r.error;
      }
      if (error) { showToast('保存失败', 'error'); return; }
      showToast('保存成功');
      document.querySelector('.modal-overlay').remove();
      loadSchedule();

      const item = currentSchedule.find(s => s.id === id);
      if (!item) return;
      showAddScheduleModal(item);
    };
    window.deleteSchedule = async function(id) {
      if (!confirm('删除该课程？')) return;
      await supabase.from('schedule').delete().eq('id', id);
      showToast('已删除');
      document.querySelector('.modal-overlay').remove();

    window.importSchedule = function() {
      const input = document.createElement('input'); input.type = 'file'; input.accept = '.xlsx,.xls';
      input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        try {
          const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);
          const inserts = rows.map(row => ({
            class_id: AppState.currentProfile.class_id,
            subject: row['科目'] || row['subject'] || '',
            teacher: row['教师'] || row['teacher'] || '',
            day: row['星期'] || row['day'] || '',
            period: parseInt(row['节次'] || row['period']) || 1,
            week: row['周次'] ? parseInt(row['周次']) : null
          })).filter(s => s.subject && s.day);
          if (inserts.length === 0) { showToast('无有效数据', 'error'); return; }
          await supabase.from('schedule').insert(inserts);
          showToast(`导入 ${inserts.length} 条`);
          loadSchedule();
        } catch (err) { showToast('导入失败', 'error'); }
      };
      input.click();
    };

      const inserts = scheduleData.map(item => ({
        class_id: AppState.currentProfile.class_id,
        subject: item.subject,
        teacher: item.teacher || '',
        day: item.day,
        period: item.period,
        week: item.week || null
      }));

    async function loadAttendance() {
      const container = document.getElementById('page-attendance');

      const { data: students } = await supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id);

      const total = students ? students.length : 0;
      const present = attend ? attend.filter(a => a.status === 'present').length : 0;

      const month = today.substring(0,7);
      const { data: monthAttend } = await supabase.from('attendance').select('*').eq('class_id', AppState.currentProfile.class_id).gte('date', `${month}-01`).lt('date', `${month}-31`);
      const monthRate = monthAttend ? Math.round(monthAttend.filter(a=>a.status==='present').length / (monthAttend.length||1)*100) : 0;

    function renderAttendance(students, attendMap) {
      const container = document.getElementById('attendance-list');
      if (!students || students.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-user"></i><p>暂无学生</p></div>'; return; }
      let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;">';
      students.forEach(s => {
        const status = attendMap[s.id] || 'absent';
        const checked = status === 'present' ? 'checked' : '';
        html += `<div style="display:flex;align-items:center;gap:6px;background:var(--bg-card);padding:6px 10px;border-radius:8px;">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
            <input type="checkbox" class="attend-check" data-student="${s.id}" ${checked} onchange="updateAttendance(this)"> ${escapeHtml(s.name)}
          </label>
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    window.updateAttendance = function(el) {};
    window.saveAttendance = async function() {
      const date = document.getElementById('attendance-date').value;
      const checks = document.querySelectorAll('.attend-check');
      const updates = [];
      checks.forEach(chk => {
        const studentId = chk.dataset.student;
        const status = chk.checked ? 'present' : 'absent';
        updates.push(supabase.from('attendance').upsert({
          class_id: AppState.currentProfile.class_id, student_id: studentId, date, status
        }, { onConflict: 'class_id,student_id,date' }));
      });
      await Promise.all(updates);
      showToast('考勤已保存');
      loadAttendance();
    };
    window.markAllPresent = function() {
      document.querySelectorAll('.attend-check').forEach(chk => chk.checked = true);
      saveAttendance();
    };

    async function renderHeatmap() {
      const container = document.getElementById('attendance-heatmap');
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const daysInMonth = new Date(year, month, 0).getDate();
      const monthStr = `${year}-${String(month).padStart(2, '0')}`;
      const { data: students } = await supabase.from('students').select('id, name').eq('class_id', AppState.currentProfile.class_id).order('name');
      if (!students || students.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-calendar"></i><p>暂无学生</p></div>'; return; }
      const { data: records } = await supabase.from('attendance').select('student_id, date, status').eq('class_id', AppState.currentProfile.class_id).gte('date', `${monthStr}-01`).lte('date', `${monthStr}-${daysInMonth}`);
      const statusMap = {};
      records.forEach(r => {
        if (!statusMap[r.student_id]) statusMap[r.student_id] = {};
        statusMap[r.student_id][r.date] = r.status;
      });
      let html = `<div style="font-size:12px;margin-bottom:6px;color:var(--text-secondary);">📅 ${year}年${month}月</div>`;
      html += `<div class="table-responsive"><table style="font-size:11px;text-align:center;border-collapse:collapse;">`;
      html += `<thead><tr><th style="position:sticky;left:0;background:var(--bg-base);z-index:2;">姓名</th>`;
      for (let d = 1; d <= daysInMonth; d++) html += `<th style="min-width:20px;">${d}</th>`;
      html += '</tr></thead><tbody>';
      students.forEach(s => {
        const studentMap = statusMap[s.id] || {};
        html += `<tr><td style="position:sticky;left:0;background:var(--bg-base);z-index:1;font-weight:bold;text-align:left;padding-right:8px;">${escapeHtml(s.name)}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateKey = `${monthStr}-${String(d).padStart(2, '0')}`;
          const status = studentMap[dateKey] || 'none';
          let color = '#2d3748', label = '';
          if (status === 'present') { color = '#10b981'; label = '出勤'; }
          else if (status === 'absent') { color = '#ef4444'; label = '缺勤'; }
          else if (status === 'leave') { color = '#f59e0b'; label = '请假'; }
          html += `<td style="background:${color};width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,0.05);" title="${dateKey} ${label}"></td>`;
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += `<div style="margin-top:8px;display:flex;gap:15px;font-size:12px;flex-wrap:wrap;">
        <span><span style="display:inline-block;width:16px;height:16px;background:#10b981;border-radius:4px;"></span> 出勤</span>
        <span><span style="display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:4px;"></span> 缺勤</span>
        <span><span style="display:inline-block;width:16px;height:16px;background:#f59e0b;border-radius:4px;"></span> 请假</span>
        <span><span style="display:inline-block;width:16px;height:16px;background:#2d3748;border-radius:4px;"></span> 未记录</span>
      </div>`;
      container.innerHTML = html;
    }

    window.renderCompareRadar = async function(baseStudentId) {
      const select = document.getElementById('compare-students');
      const selectedIds = Array.from(select.selectedOptions).map(opt => opt.value);
      if (selectedIds.length === 0) { showToast('请至少选择一位对比学生', 'warning'); return; }
      const allIds = [baseStudentId, ...selectedIds];
      const { data: scores } = await supabase.from('exam_scores').select('student_id, subject, score').in('student_id', allIds);
      if (!scores || scores.length === 0) { showToast('暂无成绩数据', 'warning'); return; }
      const { data: students } = await supabase.from('students').select('id,name').in('id', allIds);
      const nameMap = {};
      students.forEach(s => nameMap[s.id] = s.name);
      const subjects = ['语文','数学','英语','物理','化学','生物','政治','历史','地理'];
      const colors = ['#6d5dfc','#10b981','#f59e0b','#ef4444','#3b82f6','#ec4899','#8b5cf6','#06b6d4','#f97316'];
      const datasets = allIds.map((id, idx) => {
        const studentScores = scores.filter(s => s.student_id === id);
        const data = subjects.map(sub => {
          const found = studentScores.find(s => s.subject === sub);
          return found ? found.score : 0;
        });
        return { label: nameMap[id] || '未知', data, borderColor: colors[idx % colors.length], backgroundColor: 'transparent', pointBackgroundColor: colors[idx % colors.length], pointRadius: 4 };
      });
      const container = document.getElementById('compare-radar-container');
      container.style.display = 'block';
      if (compareRadarChart) { compareRadarChart.destroy(); }
      const ctx = document.getElementById('compare-radar-chart').getContext('2d');
      compareRadarChart = new Chart(ctx, {
        type: 'radar',
        data: { labels: subjects, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#e2e8f0' } } },
          scales: { r: { angleLines: { color: '#475569' }, grid: { color: '#475569' }, pointLabels: { color: '#e2e8f0' }, ticks: { color: '#e2e8f0', backdropColor: 'transparent' } } }
        }
      });
    };

    window.detectAnomalies = async function(studentId) {
      const { data: scores } = await supabase.from('exam_scores').select('*, exams(name, exam_date)').eq('student_id', studentId).order('exam_date', { ascending: true });
      if (!scores || scores.length < 2) { showToast('该学生考试次数不足，无法检测异常', 'warning'); return; }
      const subjects = [...new Set(scores.map(s => s.subject))];
      const subjectTrends = subjects.map(sub => {
        const subScores = scores.filter(s => s.subject === sub).sort((a,b) => a.exams.exam_date.localeCompare(b.exams.exam_date));
        if (subScores.length < 2) return null;
        const first = subScores[0].score;
        const last = subScores[subScores.length-1].score;
        const diff = last - first;
        const percent = first ? (diff / first * 100).toFixed(1) : 0;
        return { subject, first, last, diff, percent, exams: subScores.map(s => ({ date: s.exams.exam_date, score: s.score })) };
      }).filter(t => t !== null);
      const anomalies = subjectTrends.filter(t => t.percent < -15 || (t.exams.length > 1 && (t.exams[t.exams.length-1].score - t.exams[t.exams.length-2].score) < -20));
      if (anomalies.length === 0) { showToast('🎉 该学生成绩稳定，无明显异常波动', 'success'); return; }
      const payload = { student: AppState.allStudents.find(s => s.id === studentId), anomalies };
      showToast('AI 正在分析异常原因...', 'warning');
      const result = await callAI('anomaly_detection', payload);
      if (result) {
        const modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `
          <div class="modal-content">
            <h3>⚠️ 成绩异常检测报告</h3>
            <div style="margin:10px 0;">${anomalies.map(a => `<div style="background:rgba(239,68,68,0.1);padding:8px;border-radius:6px;margin-bottom:6px;"><strong>${a.subject}</strong>：从 ${a.first} 分 → ${a.last} 分（变化 ${a.diff > 0 ? '+' : ''}${a.diff}，${a.percent}%）</div>`).join('')}</div>
            <div style="white-space:pre-wrap;background:var(--bg-card);padding:10px;border-radius:8px;">${escapeHtml(result)}</div>
            <div class="modal-actions"><button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">关闭</button></div>
          </div>
        `;
        document.body.appendChild(modal);
      }
    };

      if (allExams && allExams.length > 1) {
        const labels = allExams.map(e => e.name);
        const data = [];
        for (const exam of allExams) {
          const { data: scores } = await supabase.from('exam_scores').select('score').eq('exam_id', exam.id);
          const valid = scores ? scores.map(s => s.score).filter(s => s !== null) : [];
          data.push(valid.length ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1) : 0);
        }
        const ctx = document.getElementById('trend-chart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: { labels, datasets: [{ label: '班级均分', data, borderColor: '#6d5dfc', backgroundColor: 'rgba(109,93,252,0.1)', fill: true }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#e2e8f0' } } } }
        });
      } else {
        document.getElementById('trend-chart').innerHTML = '<div class="empty-state"><i class="fa-regular fa-chart-line"></i><p>考试数据不足，无法绘制趋势</p></div>';
      }
      renderWeaknessAnalysis();

    async function renderWeaknessAnalysis() {
      const container = document.getElementById('weakness-container');
      const subjects = ['语文','数学','英语','物理','化学','生物','政治','历史','地理'];
      const { data: scores } = await supabase.from('exam_scores').select('subject, score').eq('class_id', AppState.currentProfile.class_id);
      if (!scores || scores.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-chart-bar"></i><p>暂无成绩数据</p></div>';
        return;
      }
      const subjectAvg = {};
      subjects.forEach(sub => {
        const subScores = scores.filter(s => s.subject === sub).map(s => s.score).filter(s => s !== null);
        subjectAvg[sub] = subScores.length ? (subScores.reduce((a,b) => a+b, 0) / subScores.length).toFixed(1) : 0;
      });
      const avgValues = subjects.map(sub => parseFloat(subjectAvg[sub]) || 0);
      const ctx = document.getElementById('weakness-chart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: subjects,
          datasets: [{
            label: '班级均分',
            data: avgValues,
            backgroundColor: avgValues.map(v => { if (v < 60) return '#ef4444'; if (v < 70) return '#f59e0b'; return '#10b981'; }),
            borderRadius: 6
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#e2e8f0' } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const score = context.raw;
                  const sub = context.label;
                  const avg = subjectAvg[sub];
                  return `均分: ${avg} 分`;
                }
              }
            }
          },
          scales: {
            y: { beginAtZero: true, max: Math.ceil(Math.max(...avgValues, 10) * 1.2), grid: { color: '#475569' }, ticks: { color: '#e2e8f0' } },
            x: { grid: { display: false }, ticks: { color: '#e2e8f0' } }
          }
        }
      });
    }

    window.generateClassReport = async function() {

      const students = AppState.allStudents;
      const total = students.length;
      const today = new Date().toISOString().split('T')[0];
      const month = today.substring(0,7);
      const { data: attendData } = await supabase.from('attendance').select('*').eq('class_id', AppState.currentProfile.class_id).gte('date', `${month}-01`).lt('date', `${month}-31`);
      const attendRate = attendData ? Math.round(attendData.filter(a=>a.status==='present').length / (attendData.length||1) * 100) : 0;
      const { data: hwSubmits } = await supabase.from('homework_submissions').select('*').eq('class_id', AppState.currentProfile.class_id);
      const submitRate = hwSubmits ? Math.round(hwSubmits.filter(s=>s.submitted).length / (hwSubmits.length||1) * 100) : 0;
      const { data: exams } = await supabase.from('exams').select('*').eq('class_id', AppState.currentProfile.class_id).order('exam_date', { ascending: true });
      let examTrend = [];
      if (exams && exams.length > 0) {
        const lastExams = exams.slice(-3);
        for (const exam of lastExams) {
          const { data: scores } = await supabase.from('exam_scores').select('score').eq('exam_id', exam.id);
          const valid = scores ? scores.map(s=>s.score).filter(s=>s!==null) : [];
          const avg = valid.length ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1) : 'N/A';
          examTrend.push({ name: exam.name, avg });
        }
      }
      const { data: posts } = await supabase.from('posts').select('id').eq('class_id', AppState.currentProfile.class_id);
      const activityCount = posts ? posts.length : 0;
      const payload = { totalStudents: total, attendRate, submitRate, examTrend, activityCount, semester: '2026秋季学期' };
      const result = await callAI('class_summary', payload);
      if (result) {
        document.getElementById('class-report-container').innerHTML = `
          <div class="card" style="border-color:var(--primary);">
            <div class="card-header"><h3>📝 班级学期总结报告</h3></div>
            <div style="white-space:pre-wrap;font-size:14px;line-height:1.8;">${escapeHtml(result)}</div>
          </div>
        `;
        showToast('报告生成成功', 'success');
      }
    };

    // ================================================================
    // 21. 通知中心
    // ================================================================
    async function loadNotifications() {
      const container = document.getElementById('page-notifications');
      const { data } = await supabase.from('notifications').select('*').eq('class_id', AppState.currentProfile.class_id).order('created_at', { ascending: false });
      container.innerHTML = `
        <div class="page-header"><h2>🔔 通知中心</h2><div class="breadcrumb">系统通知与预警</div></div>
        <button class="btn btn-outline" onclick="markAllRead()"><i class="fa-solid fa-check-double"></i> 全部已读</button>
        <div id="notification-list" style="margin-top:15px;"></div>
      `;
      const list = document.getElementById('notification-list');
      if (!data || data.length === 0) { list.innerHTML = '<div class="empty-state"><i class="fa-regular fa-bell"></i><p>暂无通知</p></div>'; return; }
      list.innerHTML = data.map(n => `
        <div class="card" style="${n.is_read ? 'opacity:0.7;' : ''}">
          <div style="display:flex;justify-content:space-between;">
            <strong>${escapeHtml(n.title)}</strong>
            <span style="font-size:12px;color:var(--text-secondary);">${new Date(n.created_at).toLocaleString()}</span>
          </div>
          <div>${escapeHtml(n.content)}</div>
          ${!n.is_read ? `<button class="btn btn-primary btn-sm" onclick="markRead('${n.id}')">标记已读</button>` : ''}
        </div>
      `).join('');
    }

    window.markRead = async function(id) {
      await supabase.from('notifications').update({ is_read: true }).eq('id', id);
      loadNotifications();
      loadNotificationBadge();
    };
    window.markAllRead = async function() {
      await supabase.from('notifications').update({ is_read: true }).eq('class_id', AppState.currentProfile.class_id);
      loadNotifications();
      loadNotificationBadge();
    };

    // ================================================================
    // 22. 任务协作
    // ================================================================
    async function loadTasks() {
      const container = document.getElementById('page-tasks');
      const { data } = await supabase.from('tasks').select('*, profiles(realname)').eq('class_id', AppState.currentProfile.class_id).order('due_date', { ascending: true });
      const pending = data ? data.filter(t => t.status === 'pending' || !t.status) : [];
      const inProgress = data ? data.filter(t => t.status === 'in_progress') : [];
      const completed = data ? data.filter(t => t.status === 'completed') : [];
      container.innerHTML = `
        <div class="page-header"><h2>📋 任务协作</h2><div class="breadcrumb">拖拽任务到不同状态列</div></div>
        <button class="btn btn-primary" onclick="showAddTaskModal()"><i class="fa-solid fa-plus"></i> 分配任务</button>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:15px;">
          <div class="card" style="border-left:3px solid #f59e0b;">
            <h4 style="color:#f59e0b;">待处理</h4>
            <div id="task-column-pending" class="task-column"></div>
          </div>
          <div class="card" style="border-left:3px solid #3b82f6;">
            <h4 style="color:#3b82f6;">进行中</h4>
            <div id="task-column-inprogress" class="task-column"></div>
          </div>
          <div class="card" style="border-left:3px solid #10b981;">
            <h4 style="color:#10b981;">已完成</h4>
            <div id="task-column-completed" class="task-column"></div>
          </div>
        </div>
      `;
      renderTaskColumn('pending', pending);
      renderTaskColumn('inprogress', inProgress);
      renderTaskColumn('completed', completed);
      initTaskDrag();
    }

    function renderTaskColumn(columnId, tasks) {
      const container = document.getElementById(`task-column-${columnId}`);
      if (!tasks || tasks.length === 0) { container.innerHTML = '<div class="empty-state" style="padding:20px;"><i class="fa-regular fa-inbox"></i><p>无任务</p></div>'; return; }
      container.innerHTML = tasks.map(t => `
        <div class="task-item" data-task-id="${t.id}">
          <div style="font-weight:600;font-size:14px;">${escapeHtml(t.title)}</div>
          <div style="font-size:12px;color:var(--text-secondary);">负责人：${t.profiles?.realname || '未分配'} | 截止：${t.due_date || '无'}</div>
          <div style="margin-top:6px;"><button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">删除</button></div>
        </div>
      `).join('');
    }

    function initTaskDrag() {
      const columns = ['pending', 'inprogress', 'completed'];
      columns.forEach(col => {
        const el = document.getElementById(`task-column-${col}`);
        if (!el) return;
        new Sortable(el, {
          group: 'tasks',
          animation: 150,
          onEnd: function(evt) {
            const taskId = evt.item.dataset.taskId;
            const newStatus = evt.to.id.replace('task-column-', '');
            supabase.from('tasks').update({ status: newStatus }).eq('id', taskId).then(() => {
              showToast('任务状态已更新', 'success');
            }).catch(err => showToast('更新失败', 'error'));
          }
        });
      });
    }

    window.showAddTaskModal = function() {
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-content">
          <h3>分配任务</h3>
          <div class="form-group"><label>标题 *</label><input id="task-title"></div>
          <div class="form-group"><label>描述</label><textarea id="task-desc" rows="3"></textarea></div>
          <div class="form-group"><label>负责人</label><select id="task-assignee">${AppState.allStudents.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select></div>
          <div class="form-group"><label>截止日期</label><input type="date" id="task-due"></div>
          <div class="modal-actions">
            <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="btn btn-primary" onclick="confirmAddTask()">分配</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    };
    window.confirmAddTask = async function() {
      const title = document.getElementById('task-title').value.trim();
      if (!title) { showToast('请输入标题', 'error'); return; }
      await supabase.from('tasks').insert({
        class_id: AppState.currentProfile.class_id,
        title,
        description: document.getElementById('task-desc').value.trim(),
        assigned_to: document.getElementById('task-assignee').value,
        due_date: document.getElementById('task-due').value,
        status: 'pending'
      });
      showToast('任务已分配');
      document.querySelector('.modal-overlay').remove();
      loadTasks();
    };
    window.deleteTask = async function(id) {
      if (!confirm('删除此任务？')) return;
      await supabase.from('tasks').delete().eq('id', id);
      showToast('已删除');
      loadTasks();
    };

    // ================================================================
    // 23. 用户管理
    // ================================================================
    async function loadUsers() {
      if (AppState.currentProfile.role !== 'admin') { document.getElementById('page-users').innerHTML = '<div class="empty-state"><i class="fa-regular fa-lock"></i><p>仅管理员可访问</p></div>'; return; }
      const container = document.getElementById('page-users');
      const { data: users } = await supabase.from('profiles').select('*');
      container.innerHTML = `
        <div class="page-header"><h2>👤 用户管理</h2><div class="breadcrumb">管理账户</div></div>
        <div class="table-responsive"><table><thead><tr><th>用户名</th><th>真实姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>
        ${users ? users.map(u => `
          <tr>
            <td>${escapeHtml(u.username)}</td>
            <td>${escapeHtml(u.realname)}</td>
            <td><select onchange="updateUserRole('${u.id}', this.value)" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;padding:4px;">
              <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
              <option value="class_teacher" ${u.role==='class_teacher'?'selected':''}>班主任</option>
              <option value="subject_teacher" ${u.role==='subject_teacher'?'selected':''}>科任教师</option>
            </select></td>
            <td>${u.is_active ? '✅ 启用' : '❌ 禁用'}</td>
            <td><button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-success'}" onclick="toggleUserStatus('${u.id}', ${!u.is_active})">${u.is_active ? '禁用' : '启用'}</button></td>
          </tr>
        `).join('') : '<tr><td colspan="5">暂无用户</td></tr>'}
        </tbody></table></div>
      `;
    }

    window.updateUserRole = async function(id, role) {
      await supabase.from('profiles').update({ role }).eq('id', id);
      showToast('角色已更新');
      loadUsers();
    };
    window.toggleUserStatus = async function(id, active) {
      await supabase.from('profiles').update({ is_active: active }).eq('id', id);
      showToast('状态已更新');
      loadUsers();
    };

    // ================================================================
    // 24. 初始化
    // ================================================================
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        AppState.currentUser = user;
        const profile = await fetchProfile();
        if (profile && profile.is_active) {
          AppState.currentProfile = profile;
          renderNavigation(); renderPageContainers(); showMain(); switchPage('dashboard');
          if (profile.role === 'admin') { loadUsers(); }
          applyBannerBackground(); loadNotificationBadge();
          supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id).then(({ data }) => { AppState.allStudents = data || []; });
          supabase.from('settings').select('*').eq('class_id', AppState.currentProfile.class_id).maybeSingle().then(({ data }) => {
            if (data) {
              AppState.schoolStartDate = data.school_start_date || '2026-09-01';
              AppState.periodTimes = data.period_times;
            }
          });
        } else { await supabase.auth.signOut(); showAuth(); }
      } else { showAuth(); }
      document.getElementById('login-tab').addEventListener('click', () => setAuthMode('login'));
      document.getElementById('signup-tab').addEventListener('click', () => setAuthMode('signup'));
      document.getElementById('auth-form').addEventListener('submit', handleAuth);
      document.getElementById('logout-btn').addEventListener('click', logout);
      document.getElementById('banner-upload-btn').addEventListener('click', () => document.getElementById('bg-upload-input').click());
      document.getElementById('bg-upload-input').addEventListener('change', handleBannerUpload);
      document.getElementById('logo-home').addEventListener('click', () => switchPage('dashboard'));
    });

    async function loadNotificationBadge() {
      const { data } = await supabase.from('notifications').select('id').eq('class_id', AppState.currentProfile.class_id).eq('is_read', false);
      const unread = data ? data.length : 0;
      const badge = document.getElementById('notification-badge');
      if (unread > 0) { badge.style.display = 'flex'; badge.textContent = unread; } else { badge.style.display = 'none'; }
    }
  </script>
</body>
</html>
