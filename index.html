<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKBUDDY PRO · 班级管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* ===== 全局样式（源自备份文件，优化完善） ===== */
    :root {
      --primary: #6d5dfc; --primary-light: #8a7fff; --primary-dark: #4f3df0;
      --secondary: #00d4ff; --bg-base: #0f172a; --bg-card: rgba(255,255,255,0.06);
      --bg-card-hover: rgba(255,255,255,0.1); --text-main: #e2e8f0; --text-secondary: #94a3b8;
      --border-glow: rgba(109,93,252,0.4); --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
      --radius: 16px; --shadow: 0 8px 32px rgba(0,0,0,0.3); --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter','Segoe UI',system-ui,sans-serif; background: var(--bg-base); color: var(--text-main); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(circle at 20% 50%, rgba(109,93,252,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0,212,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none; z-index: -2;
    }
    body::after {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: -1;
    }

    /* 认证 */
    #auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(ellipse at center, #1e1b4b 0%, #0f172a 100%); }
    .auth-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glow); border-radius: 20px; box-shadow: var(--shadow), 0 0 30px rgba(109,93,252,0.2); padding: 40px; width: 100%; max-width: 420px; animation: fadeInUp 0.6s ease-out; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .auth-card h2 { text-align: center; margin-bottom: 10px; color: #fff; font-size: 28px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 20px rgba(109,93,252,0.8); }
    .auth-card .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 14px; }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 25px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .auth-tabs button { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px; font-weight: 500; transition: var(--transition); color: var(--text-secondary); font-size: 14px; }
    .auth-tabs button.active { background: var(--primary); color: white; box-shadow: 0 0 15px rgba(109,93,252,0.5); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-main); font-size: 14px; }
    .form-group input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; font-size: 15px; color: #fff; transition: var(--transition); }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(109,93,252,0.2); background: rgba(255,255,255,0.08); }
    .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; transition: var(--transition); letter-spacing: 1px; }
    .btn-primary:hover { box-shadow: 0 0 25px rgba(109,93,252,0.6); transform: translateY(-2px); }
    .error-message { color: var(--danger); text-align: center; margin-top: 15px; min-height: 20px; font-size: 14px; }

    /* 主布局 */
    #main-container { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); color: white; padding: 20px 0; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; }
    .sidebar-logo { text-align: center; padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; cursor: pointer; }
    .sidebar-logo h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sidebar-logo .badge { font-size: 10px; background: rgba(109,93,252,0.3); padding: 2px 10px; border-radius: 12px; display: inline-block; margin-top: 3px; color: #c7d2fe; }
    .nav-links { flex: 1; padding: 0 12px; overflow-y: auto; }
    .nav-group { margin-bottom: 8px; }
    .nav-group-title { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; padding: 8px 10px; cursor: pointer; border-radius: 6px; transition: var(--transition); user-select: none; }
    .nav-group-title:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-group-title .fa-chevron-down { transition: transform 0.3s; }
    .nav-group.collapsed .nav-group-title .fa-chevron-down { transform: rotate(-90deg); }
    .nav-group-body { max-height: 500px; overflow: hidden; transition: max-height 0.4s ease; }
    .nav-group.collapsed .nav-group-body { max-height: 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 15px; margin-bottom: 3px; border-radius: 8px; color: rgba(255,255,255,0.7); transition: var(--transition); cursor: pointer; font-weight: 500; font-size: 13px; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: linear-gradient(135deg, rgba(109,93,252,0.3), rgba(0,212,255,0.2)); color: #fff; box-shadow: 0 0 15px rgba(109,93,252,0.3); }
    .nav-item i { width: 20px; text-align: center; font-size: 14px; }
    .sidebar-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }
    .user-details { flex: 1; }
    .user-details .name { font-weight: 600; font-size: 13px; }
    .user-details .role { font-size: 11px; opacity: 0.7; }
    .btn-logout { width: 100%; padding: 9px; background: rgba(255,255,255,0.08); color: #fff; border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); font-size: 13px; }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.2); }

    .main-content { flex: 1; margin-left: 250px; padding: 20px 25px; }
    .page-header { margin-bottom: 20px; }
    .page-header h2 { font-size: 24px; color: #fff; font-weight: 700; }
    .page-header .breadcrumb { color: var(--text-secondary); font-size: 13px; margin-top: 3px; }

    /* 横幅 */
    .banner { position: relative; height: 160px; border-radius: var(--radius); background: linear-gradient(135deg, #1e1b4b 0%, #4f3df0 50%, #00d4ff 100%); background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow), 0 0 30px rgba(109,93,252,0.3); overflow: hidden; }
    .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }
    .banner-content { position: relative; z-index: 2; color: #fff; }
    .banner-content h3 { font-size: 22px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .banner-content p { font-size: 13px; opacity: 0.9; }
    .banner-upload { position: absolute; top: 15px; right: 15px; z-index: 3; background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; transition: var(--transition); }
    .banner-upload:hover { background: rgba(109,93,252,0.8); transform: scale(1.1); }

    /* 统计卡片 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; align-items: center; gap: 13px; transition: var(--transition); }
    .stat-card:hover { transform: translateY(-3px); background: var(--bg-card-hover); }
    .stat-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
    .stat-icon.green { background: linear-gradient(135deg, #10b981, #059669); }
    .stat-icon.orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .stat-icon.red { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .stat-info h4 { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-info p { color: var(--text-secondary); font-size: 12px; }

    /* 卡片 */
    .card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 15px; transition: var(--transition); }
    .card:hover { border-color: rgba(255,255,255,0.2); background: var(--bg-card-hover); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .card-header h3 { font-size: 15px; color: #fff; font-weight: 600; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; }
    th { background: rgba(255,255,255,0.03); color: var(--text-secondary); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover { background: rgba(255,255,255,0.03); }

    .badge { padding: 3px 8px; border-radius: 15px; font-size: 10px; font-weight: 600; }
    .badge-success { background: rgba(16,185,129,0.2); color: #6ee7b7; }
    .badge-danger { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .badge-warning { background: rgba(245,158,11,0.2); color: #fcd34d; }
    .badge-info { background: rgba(109,93,252,0.2); color: #c7d2fe; }

    .btn { padding: 7px 13px; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; transition: var(--transition); display: inline-flex; align-items: center; gap: 5px; }
    .btn-sm { padding: 4px 8px; font-size: 10px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 4px 15px rgba(109,93,252,0.4); }
    .btn-primary:hover { box-shadow: 0 6px 25px rgba(109,93,252,0.6); transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: var(--text-main); }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .form-row input, .form-row select, .form-row textarea { padding: 8px 11px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; font-size: 12px; color: #fff; transition: var(--transition); flex: 1; min-width: 120px; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(109,93,252,0.2); }
    .form-row select option { background: #1e293b; color: #e2e8f0; }
    .form-row input::placeholder, .form-row textarea::placeholder { color: #64748b; }

    .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .quick-action { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; transition: var(--transition); }
    .quick-action:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }
    .quick-action i { font-size: 18px; color: var(--primary-light); margin-bottom: 4px; }
    .quick-action span { display: block; font-size: 11px; font-weight: 500; color: var(--text-secondary); }

    .empty-state { text-align: center; padding: 25px; color: var(--text-secondary); }
    .empty-state i { font-size: 35px; margin-bottom: 8px; opacity: 0.5; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #1e293b; border-radius: 16px; padding: 20px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal-content h3 { color: #fff; margin-bottom: 15px; }
    .modal-actions { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 10px 15px; border-radius: 8px; color: #fff; font-weight: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards; }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.warning { background: #f59e0b; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

    /* 专用组件 */
    .seat-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; padding: 10px; }
    .seat-group-gap { grid-column: span 8; height: 25px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 10px; letter-spacing: 2px; }
    .seat-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; transition: var(--transition); position: relative; }
    .seat-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .seat-item.empty { background: rgba(255,255,255,0.02); border-style: dashed; cursor: default; }
    .seat-item.empty:hover { transform: none; background: rgba(255,255,255,0.02); }
    .seat-item .seat-name { font-weight: 600; font-size: 12px; }
    .seat-item .seat-number { font-size: 9px; color: var(--text-secondary); }
    .seat-item .gender-badge { position: absolute; top: 4px; right: 4px; font-size: 9px; }
    .seat-item.male { border-left: 3px solid #3b82f6; }
    .seat-item.female { border-left: 3px solid #ec4899; }
    .seat-item.selected { border-color: var(--primary); box-shadow: 0 0 15px rgba(109,93,252,0.5); }

    .rollcall-display-box { font-size: 52px; font-weight: 800; margin: 15px 0; color: #fff; text-shadow: 0 0 30px rgba(109,93,252,0.8); letter-spacing: 2px; min-height: 80px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
    .rollcall-display-box.rolling { animation: pulse 0.2s ease infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

    .homework-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: var(--transition); }
    .homework-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
    .homework-card .hw-subject { font-size: 12px; font-weight: 600; color: var(--primary-light); }
    .homework-card .hw-title { font-size: 14px; font-weight: 600; color: #fff; }
    .homework-card .hw-meta { font-size: 11px; color: var(--text-secondary); }

    .post-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: var(--transition); }
    .post-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
    .post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    .post-media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-top: 8px; }
    .post-media-grid img { width: 100%; border-radius: 6px; object-fit: cover; }

    .comm-card-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .comm-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: var(--transition); }
    .comm-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
    .comm-card h4 { color: #fff; margin-bottom: 8px; }
    .comm-card p { font-size: 12px; color: var(--text-secondary); }

    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 15px 0; }
      .sidebar-logo h1, .sidebar-logo .badge, .user-details, .nav-item span, .nav-group-title span { display: none; }
      .nav-group-title { justify-content: center; padding: 8px; }
      .nav-group-body { max-height: 0 !important; }
      .nav-item { justify-content: center; padding: 10px; }
      .nav-item i { margin: 0; font-size: 16px; }
      .main-content { margin-left: 60px; padding: 12px; }
      .banner { height: 120px; }
      .rollcall-display-box { font-size: 32px; }
      .seat-grid { gap: 4px; }
      .comm-card-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- 通知铃铛 -->
  <div class="notification-bell" id="notification-bell" onclick="switchPage('notifications')" style="position:fixed; top:20px; right:20px; z-index:999; background:rgba(15,23,42,0.8); backdrop-filter:blur(10px); border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; border:1px solid rgba(255,255,255,0.1); transition:var(--transition);">
    <i class="fa-solid fa-bell"></i>
    <span class="notification-badge" id="notification-badge" style="display:none; position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; border-radius:50%; width:20px; height:20px; font-size:10px; display:flex; align-items:center; justify-content:center;">0</span>
  </div>

  <!-- 认证容器 -->
  <div id="auth-container">
    <div class="auth-card">
      <h2><i class="fa-solid fa-graduation-cap"></i> WORKBUDDY PRO</h2>
      <p class="subtitle">班级管理系统 · 云端版</p>
      <div class="auth-tabs">
        <button id="login-tab" class="active">登录</button>
        <button id="signup-tab">注册</button>
      </div>
      <form id="auth-form">
        <div class="form-group"><label>用户名</label><input type="text" id="username" required placeholder="请输入用户名"></div>
        <div class="form-group" id="realname-group" style="display:none;"><label>真实姓名</label><input type="text" id="realname" placeholder="请输入真实姓名"></div>
        <div class="form-group"><label>密码</label><input type="password" id="password" required minlength="6" placeholder="至少6位密码"></div>
        <button type="submit" class="btn-primary" id="auth-submit-btn">登 录</button>
      </form>
      <p id="auth-message" class="error-message"></p>
    </div>
  </div>

  <!-- 主容器 -->
  <div id="main-container" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-logo" id="logo-home"><h1>WORKBUDDY</h1><span class="badge">PRO 云端版</span></div>
      <nav class="nav-links" id="nav-links"></nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="user-avatar-letter">A</div>
          <div class="user-details">
            <div class="name" id="sidebar-username">用户名</div>
            <div class="role" id="sidebar-role">角色</div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="banner" id="top-banner">
        <div class="banner-content"><h3 id="banner-greeting">早上好，老师！</h3><p id="banner-class-info">班级：加载中...</p></div>
        <div class="banner-upload" id="banner-upload-btn" title="更换背景图"><i class="fa-solid fa-camera"></i></div>
      </div>
      <input type="file" id="bg-upload-input" accept="image/*" style="display:none;">
      <div id="page-container"></div>
    </main>

    function showToast(message, type = 'success') {

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      return lines.map(line => {
        const result = []; let current = ''; let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') inQuotes = !inQuotes;
          else if (c === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
          else current += c;
        }
        result.push(current.trim()); return result;
      });
    }
    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(new File([blob], 'compressed.jpg', { type: 'image/jpeg' })), 'image/jpeg', quality);
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }

              <button class="btn btn-outline btn-sm" id="export-students-btn"><i class="fa-solid fa-download"></i> 导出</button>
            </div>
          </div>
          <div class="table-responsive">
            <table id="students-table">
              <thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>座位</th><th>职务</th><th>家长姓名</th><th>家长电话</th><th>住址</th><th>操作</th></tr></thead>
              <tbody id="students-tbody"></tbody>
            </table>
            <div id="students-empty" class="empty-state" style="display:none;"><i class="fa-solid fa-user-plus"></i><p>暂无学生</p></div>
          </div>
        </div>`;
      if (!AppState.currentProfile) return;
      loadStudentData();

      document.getElementById('add-student-btn').addEventListener('click', () => openStudentModal());
      document.getElementById('import-students-btn').addEventListener('click', openImportModal);
      document.getElementById('export-students-btn').addEventListener('click', () => exportStudents(AppState.allStudents));
      document.getElementById('filter-gender').addEventListener('change', applyStudentFilters);
      document.getElementById('filter-role').addEventListener('change', applyStudentFilters);
      document.getElementById('search-student').addEventListener('input', applyStudentFilters);
    }

    function loadStudentData() {
      supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id).order('seat', { ascending: true }).then(({ data }) => {
        AppState.allStudents = data || [];
        document.getElementById('stu-total').textContent = data.length;
        document.getElementById('stu-male').textContent = data.filter(s => s.gender === '男').length;
        document.getElementById('stu-female').textContent = data.filter(s => s.gender === '女').length;
        document.getElementById('stu-cadre').textContent = data.filter(s => s.role && s.role.trim() !== '').length;
        applyStudentFilters();
      });
    }

    function applyStudentFilters() {
      const gender = document.getElementById('filter-gender')?.value || '';
      const role = document.getElementById('filter-role')?.value || '';
      const search = document.getElementById('search-student')?.value.toLowerCase() || '';
      let filtered = AppState.allStudents.filter(s => {
        if (gender && s.gender !== gender) return false;
        if (role === '班干部' && (!s.role || s.role.trim() === '')) return false;
        if (search && !(s.name.toLowerCase().includes(search) || (s.student_no && s.student_no.toLowerCase().includes(search)))) return false;
        return true;
      });
      const tbody = document.getElementById('students-tbody');
      const empty = document.getElementById('students-empty');
      tbody.innerHTML = '';
      if (filtered.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      filtered.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(s.student_no || '-')}</td>
          <td><a href="#" class="student-detail-link" data-id="${s.id}" style="color:#8a7fff;">${escapeHtml(s.name)}</a></td>
          <td>${s.gender === '男' ? '<i class="fa-solid fa-mars" style="color:#3b82f6;"></i> 男' : s.gender === '女' ? '<i class="fa-solid fa-venus" style="color:#ec4899;"></i> 女' : '-'}</td>
          <td>${s.seat || '-'}</td>
          <td>${s.role ? `<span class="badge badge-info">${escapeHtml(s.role)}</span>` : '-'}</td>
          <td>${escapeHtml(s.parent_name || '-')}</td>
          <td>${escapeHtml(s.parent_phone || '-')}</td>
          <td>${escapeHtml(s.address || '-')}</td>
          <td><button class="btn btn-sm btn-primary edit-student-btn" data-id="${s.id}"><i class="fa-solid fa-edit"></i></button> <button class="btn btn-sm btn-danger delete-student-btn" data-id="${s.id}"><i class="fa-solid fa-trash"></i></button></td>`;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.student-detail-link').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openStudentDetail(a.dataset.id); }));
      tbody.querySelectorAll('.edit-student-btn').forEach(btn => btn.addEventListener('click', () => openStudentModal(btn.dataset.id)));
      tbody.querySelectorAll('.delete-student-btn').forEach(btn => btn.addEventListener('click', () => deleteStudent(btn.dataset.id)));
    }

    function openStudentModal(studentId = null) {
      const student = studentId ? AppState.allStudents.find(s => s.id == studentId) : null;
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content"><h3>${student ? '编辑学生' : '添加学生'}</h3>
        <div class="form-row" style="flex-direction:column;gap:8px;">
          <div class="form-row"><input type="text" id="modal-student-no" placeholder="学号" value="${student?.student_no || ''}"><input type="text" id="modal-student-name" placeholder="姓名" value="${student?.name || ''}"></div>
          <div class="form-row">
            <select id="modal-student-gender"><option value="">选择性别</option><option value="男" ${student?.gender === '男' ? 'selected' : ''}>男</option><option value="女" ${student?.gender === '女' ? 'selected' : ''}>女</option></select>
            <input type="number" id="modal-student-seat" placeholder="座位号" value="${student?.seat || ''}">
            <select id="modal-student-role"><option value="">选择职务</option>${['班长','副班长','学习委员','纪律委员','劳动委员','体育委员','文艺委员','生活委员','宣传委员','组织委员'].map(r => `<option value="${r}" ${student?.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
          </div>
          <div class="form-row"><input type="text" id="modal-parent-name" placeholder="家长姓名" value="${student?.parent_name || ''}"><input type="text" id="modal-student-phone" placeholder="家长电话" value="${student?.parent_phone || ''}"></div>
          <input type="text" id="modal-student-address" placeholder="家庭住址" value="${student?.address || ''}">
        </div>
        <div class="modal-actions"><button class="btn btn-outline" id="modal-cancel">取消</button><button class="btn btn-primary" id="modal-save">保存</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('modal-cancel').addEventListener('click', () => modal.remove());
      document.getElementById('modal-save').addEventListener('click', async () => {
        const data = {
          student_no: document.getElementById('modal-student-no').value.trim() || null,
          name: document.getElementById('modal-student-name').value.trim(),
          gender: document.getElementById('modal-student-gender').value || null,
          seat: document.getElementById('modal-student-seat').value ? parseInt(document.getElementById('modal-student-seat').value) : null,
          role: document.getElementById('modal-student-role').value || null,
          parent_name: document.getElementById('modal-parent-name').value.trim() || null,
          parent_phone: document.getElementById('modal-student-phone').value.trim() || null,
          address: document.getElementById('modal-student-address').value.trim() || null
        };
        if (!data.name) { showToast('姓名不能为空', 'error'); return; }
        try {
          if (studentId) { await supabase.from('students').update(data).eq('id', studentId); showToast('学生信息已更新', 'success'); }
          else { await supabase.from('students').insert({ ...data, class_id: AppState.currentProfile.class_id }); showToast('学生添加成功', 'success'); }
          modal.remove(); loadStudentData(); loadDashboard();
        } catch (err) { showToast('保存失败：' + err.message, 'error'); }
      });
    }

    function deleteStudent(id) {
      if (!confirm('确定删除该学生？')) return;
      supabase.from('students').delete().eq('id', id).then(() => { showToast('学生已删除', 'success'); loadStudentData(); });
    }

    function openStudentDetail(studentId) {
      const student = AppState.allStudents.find(s => s.id == studentId);
      if (!student) return;
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content" style="max-width:700px;"><h3>学生详情 - ${escapeHtml(student.name)}</h3>
        <div style="color:var(--text-secondary);margin-bottom:10px;">
          <p>学号：${escapeHtml(student.student_no || '-')} | 性别：${escapeHtml(student.gender || '-')} | 座位：${student.seat || '-'} | 职务：${escapeHtml(student.role || '-')}</p>
          <p>家长：${escapeHtml(student.parent_name || '-')} | 电话：${escapeHtml(student.parent_phone || '-')} | 住址：${escapeHtml(student.address || '-')}</p>
        </div>
        <h4 style="color:#fff;">成长记录</h4>
        <div id="record-list">加载中...</div>
        <div class="form-row" style="margin-top:8px;">
          <select id="record-type" style="max-width:100px;"><option value="talk">谈话</option><option value="discipline">违纪</option><option value="praise">表扬</option></select>
          <input type="text" id="record-content" placeholder="记录内容" style="flex:2;">
          <input type="date" id="record-date" style="max-width:130px;">
          <button class="btn btn-primary btn-sm" id="add-record-btn">添加</button>
        </div>
        <div class="modal-actions"><button class="btn btn-outline" id="modal-close">关闭</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('modal-close').addEventListener('click', () => modal.remove());
      loadProfileRecords(student.id, modal.querySelector('#record-list'));
      modal.querySelector('#add-record-btn').addEventListener('click', async () => {
        const type = modal.querySelector('#record-type').value;
        const content = modal.querySelector('#record-content').value.trim();
        const date = modal.querySelector('#record-date').value || new Date().toISOString().split('T')[0];
        if (!content) { showToast('请输入内容', 'error'); return; }
        await supabase.from('growth_logs').insert({ student_id: student.id, type, content, date });
        modal.querySelector('#record-content').value = '';
        loadProfileRecords(student.id, modal.querySelector('#record-list'));
        showToast('成长记录已添加', 'success');
      });
    }

    function loadProfileRecords(studentId, container) {
      supabase.from('growth_logs').select('*').eq('student_id', studentId).order('date', { ascending: false }).then(({ data }) => {
        if (!data || data.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary);">暂无记录</p>'; return; }
        container.innerHTML = data.map(r => `<div style="background:rgba(255,255,255,0.05);border-radius:6px;padding:6px;margin-bottom:4px;display:flex;justify-content:space-between;"><span>${escapeHtml(r.content)}</span><span style="font-size:11px;color:var(--text-secondary);">${r.date} ${r.type}</span></div>`).join('');
      });
    }

    function openImportModal() {
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content"><h3>批量导入学生</h3>
        <p style="color:var(--text-secondary);font-size:12px;margin-bottom:8px;">支持CSV/Excel，列顺序：<strong>学号,姓名,性别,座位,职务,家长姓名,家长电话,住址</strong>（表头自动识别）</p>
        <textarea id="import-csv" rows="5" placeholder="粘贴CSV数据，例如：&#10;2024001,张三,男,1,班长,张父,13800138000,幸福小区" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;padding:10px;"></textarea>
        <div class="form-row" style="margin-top:8px;"><input type="file" id="import-file" accept=".csv,.xlsx,.xls" style="flex:1;"></div>
        <div class="modal-actions"><button class="btn btn-outline" id="import-cancel">取消</button><button class="btn btn-primary" id="import-submit">导入</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('import-cancel').addEventListener('click', () => modal.remove());
      document.getElementById('import-submit').addEventListener('click', async () => {
        const csvText = modal.querySelector('#import-csv').value.trim();
        const fileInput = modal.querySelector('#import-file');
        let rows = [];
        if (csvText) { rows = parseCSV(csvText); }
        else if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          if (file.name.endsWith('.csv')) { rows = parseCSV(await file.text()); }
          else { const data = await file.arrayBuffer(); const wb = XLSX.read(data, { type: 'array' }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }); }
        } else { showToast('请输入数据或选择文件', 'error'); return; }
        if (rows.length === 0) { showToast('没有数据', 'error'); return; }
        // 智能识别表头
        const headerKeywords = ['学号','姓名','性别','座位','职务','家长','电话','住址'];
        let hasHeader = false;
        if (rows[0]) {
          hasHeader = rows[0].some(cell => headerKeywords.some(kw => String(cell).includes(kw)));
          if (hasHeader) rows.shift();
        }
        const studentsToInsert = rows.filter(r => r.length >= 2 && r[1]).map(r => ({
          student_no: r[0] ? String(r[0]).trim() : null,
          name: String(r[1]).trim(),
          gender: r[2] ? String(r[2]).trim() : null,
          seat: r[3] ? parseInt(r[3]) : null,
          role: r[4] ? String(r[4]).trim() : null,
          parent_name: r[5] ? String(r[5]).trim() : null,
          parent_phone: r[6] ? String(r[6]).trim() : null,
          address: r[7] ? String(r[7]).trim() : null,
          class_id: AppState.currentProfile.class_id
        }));
        if (studentsToInsert.length === 0) { showToast('没有有效数据', 'error'); return; }
        const { error } = await supabase.from('students').insert(studentsToInsert);
        if (error) { showToast('导入失败：' + error.message, 'error'); return; }
        showToast(`成功导入 ${studentsToInsert.length} 名学生`, 'success');
        modal.remove(); loadStudentData();
      });
    }

    // ==================== 座次表 ====================
    function loadSeating() {
      const container = document.getElementById('page-seating');
      container.innerHTML = `
        <div class="page-header"><h2>座次表</h2><div class="breadcrumb">首页 / 座次表</div></div>
        <div class="card">
          <div class="card-header"><h3>座位编排</h3><div class="form-row">
            <button class="btn btn-primary btn-sm" id="auto-seat-btn"><i class="fa-solid fa-magic"></i> 自动排座</button>
            <button class="btn btn-outline btn-sm" id="reset-seat-btn"><i class="fa-solid fa-rotate"></i> 清空座位</button>
            <span style="font-size:11px;color:var(--text-secondary);"><span style="color:#3b82f6;">■</span>男 <span style="color:#ec4899;">■</span>女</span>
          </div></div>
          <div id="seat-grid-container"></div>
          <p style="margin-top:8px;color:var(--text-secondary);font-size:11px;">上方为讲台；1-2列、3-4列、5-6列、7-8列为小组，组间过道。点击学生交换座位。</p>
        </div>
        <div class="card"><div class="card-header"><h3>未就座学生</h3></div><div id="unseated-students" class="empty-state"><i class="fa-solid fa-chair"></i><p>暂无未就座学生</p></div></div>`;
      if (!AppState.currentProfile) return;
      supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id).order('seat').then(({ data }) => {
        AppState.allStudents = data; renderSeatGrid(); renderUnseated();
      });
      document.getElementById('auto-seat-btn').addEventListener('click', autoSeat);
      document.getElementById('reset-seat-btn').addEventListener('click', resetSeats);
    }

    function renderSeatGrid() {
      const container = document.getElementById('seat-grid-container');
      container.innerHTML = '';
      const maxSeat = 64;
      const seatMap = {}; AppState.allStudents.forEach(s => { if (s.seat && s.seat <= 64) seatMap[s.seat] = s; });
      let html = `<div style="text-align:center;margin-bottom:10px;"><span style="background:rgba(255,255,255,0.1);padding:5px 20px;border-radius:6px;letter-spacing:2px;font-size:12px;">讲 台</span></div>`;
      html += '<div class="seat-grid">';
      for (let seat = 1; seat <= maxSeat; seat++) {
        const student = seatMap[seat];
        const genderClass = student ? (student.gender === '男' ? 'male' : student.gender === '女' ? 'female' : '') : '';
        const genderIcon = student ? (student.gender === '男' ? '<i class="fa-solid fa-mars" style="color:#3b82f6;font-size:9px;"></i>' : student.gender === '女' ? '<i class="fa-solid fa-venus" style="color:#ec4899;font-size:9px;"></i>' : '') : '';
        html += `<div class="seat-item ${student ? '' : 'empty'} ${genderClass}" data-seat="${seat}" data-student-id="${student?.id || ''}">
          ${student ? `<div class="seat-name">${escapeHtml(student.name)}</div><div class="seat-number">座位${seat} ${genderIcon}</div>` : `<div class="seat-number">座位${seat}</div>`}
        </div>`;
        if (seat % 8 === 2 || seat % 8 === 4 || seat % 8 === 6) {
          html += `<div class="seat-group-gap">──── 过道 ────</div>`;
        }
      }
      html += '</div>';
      container.innerHTML = html;
      container.querySelectorAll('.seat-item:not(.empty)').forEach(div => div.addEventListener('click', () => handleSeatClick(div)));
    }

    function handleSeatClick(div) {
      const studentId = parseInt(div.dataset.studentId);
      const student = AppState.allStudents.find(s => s.id === studentId);
      if (!student) return;
      if (AppState.selectedStudents.length === 0) { AppState.selectedStudents.push(student); div.classList.add('selected'); }
      else if (AppState.selectedStudents.length === 1 && AppState.selectedStudents[0].id === student.id) { AppState.selectedStudents = []; div.classList.remove('selected'); }
      else {
        const other = AppState.selectedStudents[0];
        const tempSeat = other.seat; other.seat = student.seat; student.seat = tempSeat;
        AppState.selectedStudents = [];
        updateSeatInDatabase(other); updateSeatInDatabase(student);
        renderSeatGrid(); renderUnseated();
      }
    }

    function updateSeatInDatabase(student) {
      supabase.from('students').update({ seat: student.seat }).eq('id', student.id).then(() => {});
    }

    function renderUnseated() {
      const unseated = AppState.allStudents.filter(s => !s.seat || s.seat > 64);
      const container = document.getElementById('unseated-students');
      if (unseated.length === 0) { container.innerHTML = '<i class="fa-solid fa-chair"></i><p>暂无未就座学生</p>'; return; }
      container.innerHTML = unseated.map(s => `<span style="display:inline-block;margin:4px;padding:4px 8px;background:rgba(255,255,255,0.05);border-radius:20px;">${escapeHtml(s.name)}</span>`).join('');
    }

    function autoSeat() {
      const students = [...AppState.allStudents];
      for (let i = students.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [students[i], students[j]] = [students[j], students[i]]; }
      const updates = students.map((s, idx) => ({ id: s.id, seat: idx + 1 }));
      Promise.all(updates.map(u => supabase.from('students').update({ seat: u.seat }).eq('id', u.id))).then(() => {
        showToast('自动排座完成', 'success'); loadSeating();
      });
    }

    function resetSeats() {
      if (!confirm('确定清空所有座位？')) return;
      Promise.all(AppState.allStudents.map(s => supabase.from('students').update({ seat: null }).eq('id', s.id))).then(() => { showToast('座位已清空', 'success'); loadSeating(); });
    }

    // ==================== 随机点名（使用 rollcall_history） ====================
    let rollcallTimer = null;
    let isRolling = false;
    let calledIds = new Set();

    function loadRollcall() {
      const container = document.getElementById('page-rollcall');
      container.innerHTML = `
        <div class="page-header"><h2>随机点名</h2><div class="breadcrumb">首页 / 随机点名</div></div>
        <div class="card" style="text-align:center;padding:30px;">
          <div id="rollcall-display-box" class="rollcall-display-box">准备就绪</div>
          <div style="margin-bottom:15px;">
            <button class="btn btn-primary" id="start-rollcall-btn" style="font-size:15px;padding:10px 20px;"><i class="fa-solid fa-play"></i> 开始点名</button>
            <button class="btn btn-danger" id="stop-rollcall-btn" style="font-size:15px;padding:10px 20px;display:none;"><i class="fa-solid fa-stop"></i> 暂停</button>
            <button class="btn btn-outline" id="reset-rollcall-btn" style="font-size:15px;padding:10px 20px;"><i class="fa-solid fa-rotate"></i> 重置</button>
          </div>
          <div style="color:var(--text-secondary);font-size:13px;margin-bottom:10px;">已点名 <span id="rollcall-count">0</span> 人 / 共 <span id="rollcall-total">0</span> 人</div>
          <div id="rollcall-history" style="text-align:left;"><h4 style="color:var(--text-secondary);margin-bottom:8px;">点名历史</h4><div id="rollcall-history-list" class="empty-state"><i class="fa-regular fa-clock"></i><p>暂无记录</p></div></div>
        </div>`;
      if (!AppState.currentProfile) return;
      loadRollcallHistory();
      document.getElementById('start-rollcall-btn').addEventListener('click', startRollcall);
      document.getElementById('stop-rollcall-btn').addEventListener('click', stopRollcall);
      document.getElementById('reset-rollcall-btn').addEventListener('click', resetRollcall);
    }

    function startRollcall() {
      if (isRolling || AppState.allStudents.length === 0) return;
      const available = AppState.allStudents.filter(s => !calledIds.has(s.id));
      if (available.length === 0) { resetRollcall(); return; }
      isRolling = true;
      document.getElementById('start-rollcall-btn').style.display = 'none';
      document.getElementById('stop-rollcall-btn').style.display = 'inline-flex';
      const display = document.getElementById('rollcall-display-box');
      display.classList.add('rolling');
      rollcallTimer = setInterval(() => {
        const random = available[Math.floor(Math.random() * available.length)];
        display.textContent = random.name;
      }, 80);
    }

    function stopRollcall() {
      if (!isRolling) return;
      isRolling = false; clearInterval(rollcallTimer);
      const display = document.getElementById('rollcall-display-box');
      display.classList.remove('rolling');
      document.getElementById('start-rollcall-btn').style.display = 'inline-flex';
      document.getElementById('stop-rollcall-btn').style.display = 'none';
      const selectedName = display.textContent;
      const selected = AppState.allStudents.find(s => s.name === selectedName);
      if (selected) {
        supabase.from('rollcall_history').insert({ class_id: AppState.currentProfile.class_id, student_id: selected.id, date: new Date().toISOString().split('T')[0] }).then(() => { loadRollcallHistory(); });
        showToast(`点中：${selected.name}`, 'success');
      }
    }

    function resetRollcall() {
      if (isRolling) { clearInterval(rollcallTimer); isRolling = false; }
      document.getElementById('start-rollcall-btn').style.display = 'inline-flex';
      document.getElementById('stop-rollcall-btn').style.display = 'none';
      document.getElementById('rollcall-display-box').classList.remove('rolling');
      document.getElementById('rollcall-display-box').textContent = '准备就绪';
      supabase.from('rollcall_history').delete().eq('class_id', AppState.currentProfile.class_id).then(() => { loadRollcallHistory(); });
    }

    function loadRollcallHistory() {
      supabase.from('rollcall_history').select('*, students(name)').eq('class_id', AppState.currentProfile.class_id).order('created_at', { ascending: false }).limit(30).then(({ data }) => {
        calledIds = new Set(data.map(r => r.student_id));
        const container = document.getElementById('rollcall-history-list');
        if (!data || data.length === 0) { container.innerHTML = '<i class="fa-regular fa-clock"></i><p>暂无记录</p>'; }
        else {

    function loadHomework() {

    function loadHomeworkData() {
      supabase.from('homework').select('*').eq('class_id', AppState.currentProfile.class_id).order('created_at', { ascending: false }).then(({ data }) => {
        AppState.homeworkList = data || [];
        document.getElementById('hw-total').textContent = AppState.homeworkList.length;
        const now = new Date();
        const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
        document.getElementById('hw-week').textContent = AppState.homeworkList.filter(h => new Date(h.assigned_date) >= weekAgo).length;
        const homeworkIds = AppState.homeworkList.map(h => h.id);
        if (homeworkIds.length > 0) {
          supabase.from('homework_submissions').select('status').in('homework_id', homeworkIds).then(({ data: subs }) => {
            if (subs && subs.length > 0) {
              const submitted = subs.filter(s => s.status === 'submitted' || s.status === 'late').length;
              document.getElementById('hw-submit-rate').textContent = Math.round((submitted / subs.length) * 100) + '%';
            }
            document.getElementById('hw-missing').textContent = subs ? subs.filter(s => s.status === 'missing').length : 0;
          });
        }
        const subjects = [...new Set(AppState.homeworkList.map(h => h.subject))];
        const subjectFilter = document.getElementById('subject-filter');
        subjectFilter.innerHTML = `<div class="nav-item ${currentHomeworkSubject === '' ? 'active' : ''}" data-subject=""><i class="fa-solid fa-list"></i><span>全部</span></div>`;
        subjects.forEach(sub => {
          subjectFilter.innerHTML += `<div class="nav-item ${currentHomeworkSubject === sub ? 'active' : ''}" data-subject="${escapeHtml(sub)}"><i class="fa-solid fa-book"></i><span>${escapeHtml(sub)}</span></div>`;
        });
        subjectFilter.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => {
          currentHomeworkSubject = el.dataset.subject;
          subjectFilter.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          renderHomeworkList();
        }));
        renderHomeworkList();
      });
    }

    function renderHomeworkList() {
      let list = AppState.homeworkList;
      if (currentHomeworkSubject) list = list.filter(h => h.subject === currentHomeworkSubject);
      if (currentHomeworkWeek === 'current') {
        const now = new Date(); const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1);
        list = list.filter(h => new Date(h.assigned_date) >= weekStart);
      } else if (currentHomeworkWeek === 'last') {
        const now = new Date(); const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() - 6);
        const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
        list = list.filter(h => new Date(h.assigned_date) >= weekStart && new Date(h.assigned_date) <= weekEnd);
      }
      const container = document.getElementById('homework-list-container');
      if (list.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-book-open"></i><p>暂无作业</p></div>'; return; }
      container.innerHTML = list.map(hw => {
        const deadline = hw.deadline ? new Date(hw.deadline) : null;
        const daysLeft = deadline ? Math.ceil((deadline - new Date()) / (24*60*60*1000)) : null;
        return `<div class="homework-card" data-id="${hw.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="hw-subject">${escapeHtml(hw.subject)}</span>
            <span class="badge ${daysLeft !== null && daysLeft < 0 ? 'badge-danger' : daysLeft !== null && daysLeft <= 2 ? 'badge-warning' : 'badge-info'}">${daysLeft !== null ? (daysLeft < 0 ? '已截止' : `剩余${daysLeft}天`) : '无截止'}</span>
          </div>
          <div class="hw-title">${escapeHtml(hw.title)}</div>
          <div class="hw-meta">布置于 ${hw.assigned_date || '-'} | 提交率: 加载中...</div>
        </div>`;
      }).join('');
      container.querySelectorAll('.homework-card').forEach(card => card.addEventListener('click', () => openHomeworkDetail(card.dataset.id)));
    }

    function openHomeworkModal(homeworkId = null) {
      const hw = homeworkId ? AppState.homeworkList.find(h => h.id == homeworkId) : null;
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content"><h3>${hw ? '编辑作业' : '布置作业'}</h3>
        <div class="form-row" style="flex-direction:column;gap:8px;">
          <input type="text" id="hw-subject" placeholder="科目" value="${hw?.subject || ''}">
          <input type="text" id="hw-title" placeholder="作业标题" value="${hw?.title || ''}">
          <textarea id="hw-description" placeholder="作业描述" rows="2">${hw?.description || ''}</textarea>
          <input type="date" id="hw-deadline" value="${hw?.deadline || ''}">
        </div>
        <div class="modal-actions"><button class="btn btn-outline" id="hw-cancel">取消</button><button class="btn btn-primary" id="hw-save">保存</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('hw-cancel').addEventListener('click', () => modal.remove());
      document.getElementById('hw-save').addEventListener('click', async () => {
        const subject = modal.querySelector('#hw-subject').value.trim();
        const title = modal.querySelector('#hw-title').value.trim();
        const description = modal.querySelector('#hw-description').value.trim();
        const deadline = modal.querySelector('#hw-deadline').value || null;
        if (!subject || !title) { showToast('科目和标题不能为空', 'error'); return; }
        if (hw) { await supabase.from('homework').update({ subject, title, description, deadline }).eq('id', hw.id); }
        else { await supabase.from('homework').insert({ class_id: AppState.currentProfile.class_id, subject, title, description, deadline, assigned_date: new Date().toISOString().split('T')[0] }); }
        modal.remove(); showToast('作业已保存', 'success'); loadHomeworkData();
      });
    }

    function openHomeworkDetail(homeworkId) {
      const hw = AppState.homeworkList.find(h => h.id == homeworkId);
      if (!hw) return;
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content" style="max-width:650px;"><h3>${escapeHtml(hw.subject)}：${escapeHtml(hw.title)}</h3>
        <p style="color:var(--text-secondary);font-size:12px;margin-bottom:10px;">${escapeHtml(hw.description || '无描述')} | 截止：${hw.deadline || '无'}</p>
        <div id="submission-detail">加载中...</div>

    function openGradeEntry(examId) {
      AppState.selectedExamId = examId;
      Promise.all([
        supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id).order('seat'),
        supabase.from('exam_scores').select('*').eq('exam_id', examId)
      ]).then(([studentsRes, scoresRes]) => {
        const students = studentsRes.data || [];
        const scores = scoresRes.data || [];
        const scoreMap = {};
        scores.forEach(g => scoreMap[`${g.student_id}_${g.subject}`] = g.score);
        const subjects = ['语文','数学','英语','物理','化学','生物','政治','历史','地理'];
        const area = document.createElement('div'); area.className = 'modal-overlay';
        area.innerHTML = `<div class="modal-content" style="max-width:800px;"><h3>成绩录入</h3>
          <div class="table-responsive" style="max-height:400px;overflow-y:auto;"><table><thead><tr><th>姓名</th>${subjects.map(s => `<th>${s}</th>`).join('')}</tr></thead><tbody>${students.map(stu => `<tr><td>${escapeHtml(stu.name)}</td>${subjects.map(sub => `<td><input type="number" class="grade-input" data-student="${stu.id}" data-subject="${sub}" value="${scoreMap[`${stu.id}_${sub}`] ?? ''}" style="width:60px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;padding:4px;"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="modal-actions"><button class="btn btn-outline" id="grade-close">关闭</button><button class="btn btn-primary" id="grade-save">保存</button></div></div>`;
        document.body.appendChild(area);
        document.getElementById('grade-close').addEventListener('click', () => area.remove());
        document.getElementById('grade-save').addEventListener('click', async () => {
          const inputs = area.querySelectorAll('.grade-input');
          const records = [];
          inputs.forEach(inp => { if (inp.value !== '' && !isNaN(parseFloat(inp.value))) records.push({ class_id: AppState.currentProfile.class_id, exam_id: examId, student_id: parseInt(inp.dataset.student), subject: inp.dataset.subject, score: parseFloat(inp.value) }); });
          await supabase.from('exam_scores').delete().eq('exam_id', examId);
          if (records.length) await supabase.from('exam_scores').insert(records);
          area.remove(); showToast('成绩保存成功', 'success'); loadGrades();
        });
      });
    }

    function openGradeImportModal() {
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content"><h3>导入成绩Excel</h3>
        <p style="color:var(--text-secondary);font-size:12px;">Excel格式：第一行表头含“姓名”或“学号”，其余列为科目名，成绩按行填入。</p>
        <select id="import-exam-select" style="width:100%;margin-bottom:8px;"><option value="">选择考试</option></select>
        <input type="file" id="import-grades-file" accept=".xlsx,.xls" style="width:100%;margin-bottom:8px;">
        <div class="modal-actions"><button class="btn btn-outline" id="import-grades-cancel">取消</button><button class="btn btn-primary" id="import-grades-submit">导入</button></div></div>`;
      document.body.appendChild(modal);
      supabase.from('exams').select('*').eq('class_id', AppState.currentProfile.class_id).then(({ data }) => {
        const select = modal.querySelector('#import-exam-select');
        select.innerHTML = '<option value="">选择考试</option>' + (data || []).map(e => `<option value="${e.id}">${escapeHtml(e.exam_name)}</option>`).join('');
      });
      document.getElementById('import-grades-cancel').addEventListener('click', () => modal.remove());
      document.getElementById('import-grades-submit').addEventListener('click', async () => {
        const examId = modal.querySelector('#import-exam-select').value;
        const file = modal.querySelector('#import-grades-file').files[0];
        if (!examId || !file) { showToast('请选择考试和文件', 'error'); return; }
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        if (rows.length < 2) { showToast('数据不足', 'error'); return; }
        const header = rows[0];
        const nameIdx = header.findIndex(h => String(h).includes('姓名') || String(h).includes('学号'));
        if (nameIdx === -1) { showToast('未找到姓名列', 'error'); return; }
        const subjectIndices = [];
        header.forEach((h, idx) => { if (idx !== nameIdx) subjectIndices.push({ idx, subject: String(h).trim() }); });
        const studentsRes = await supabase.from('students').select('*').eq('class_id', AppState.currentProfile.class_id);
        const studentList = studentsRes.data || [];
        const records = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const studentName = String(row[nameIdx]).trim();
          const student = studentList.find(s => s.name === studentName || s.student_no === studentName);
          if (!student) continue;
          subjectIndices.forEach(({ idx, subject }) => {
            const score = parseFloat(row[idx]);
            if (!isNaN(score)) records.push({ class_id: AppState.currentProfile.class_id, exam_id: examId, student_id: student.id, subject, score });
          });
        }
        await supabase.from('exam_scores').delete().eq('exam_id', examId);
        if (records.length) await supabase.from('exam_scores').insert(records);
        modal.remove(); showToast(`导入 ${records.length} 条成绩`, 'success'); loadGrades();
      });
    }

      supabase.from('exams').delete().eq('id', examId).then(() => { showToast('考试已删除', 'success'); loadGrades(); });

    function loadScheduleData() {
      const weekType = document.getElementById('schedule-week-type')?.value || 'both';
      const viewType = AppState.scheduleView;
      let query = supabase.from('schedule').select('*').eq('class_id', AppState.currentProfile.class_id);
      if (viewType === 'class') {
        query = query.or(`week_type.eq.${weekType},week_type.eq.both`);
      } else {
        const teacherName = AppState.currentProfile.realname || AppState.currentProfile.username;
        query = query.eq('teacher_name', teacherName).or(`week_type.eq.${weekType},week_type.eq.both`);
      }
      query.then(({ data }) => {
        const tbody = document.getElementById('schedule-tbody');
        tbody.innerHTML = '';
        const periods = 8;
        for (let period = 1; period <= periods; period++) {
          const tr = document.createElement('tr');
          let rowHtml = `<td>第${period}节</td>`;
          for (let day = 1; day <= 7; day++) {
            const slot = data.find(s => s.day_of_week === day && s.period === period);
            rowHtml += `<td>${slot ? `${escapeHtml(slot.subject)}${slot.teacher_name ? `<br><small style="font-size:10px;">${escapeHtml(slot.teacher_name)}</small>` : ''}` : ''}</td>`;
          }
          tr.innerHTML = rowHtml;
          tbody.appendChild(tr);
        }
      });
    }

    function openScheduleImportModal() {
      const modal = document.createElement('div'); modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-content"><h3>导入课程表Excel</h3>
        <p style="color:var(--text-secondary);font-size:12px;">Excel格式：第一行为节次，第一列为星期，交叉单元格填课程名称。可含教师名（如“语文(张老师)”）。</p>
        <input type="file" id="import-schedule-file" accept=".xlsx,.xls" style="width:100%;margin-bottom:8px;">
        <div class="modal-actions"><button class="btn btn-outline" id="import-schedule-cancel">取消</button><button class="btn btn-primary" id="import-schedule-submit">导入</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('import-schedule-cancel').addEventListener('click', () => modal.remove());
      document.getElementById('import-schedule-submit').addEventListener('click', async () => {
        const file = modal.querySelector('#import-schedule-file').files[0];
        if (!file) { showToast('请选择文件', 'error'); return; }
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        const records = [];
        const dayMap = { '周一': 1, '星期二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 7 };
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row[0]) continue;
          const dayStr = String(row[0]).trim();
          let day = dayMap[dayStr] || parseInt(dayStr);
          if (!day || day < 1 || day > 7) continue;
          for (let j = 1; j < row.length; j++) {
            const cell = String(row[j] || '').trim();
            if (!cell) continue;
            const period = j;
            let subject = cell;
            let teacher = null;
            const match = cell.match(/^(.+?)\((.+?)\)$/);
            if (match) { subject = match[1].trim(); teacher = match[2].trim(); }
            records.push({ class_id: AppState.currentProfile.class_id, day_of_week: day, period, subject, teacher_name: teacher, week_type: 'both' });
          }
        }
        if (records.length === 0) { showToast('未识别到课程', 'error'); return; }
        await supabase.from('schedule').delete().eq('class_id', AppState.currentProfile.class_id);
        await supabase.from('schedule').insert(records);
        modal.remove(); showToast(`导入 ${records.length} 条课程`, 'success'); loadScheduleData();
      });
    }

    function loadAttendanceStats() {
      const today = new Date().toISOString().split('T')[0];
      const monthStart = new Date(); monthStart.setDate(1); const monthStartStr = monthStart.toISOString().split('T')[0];
      Promise.all([
        supabase.from('students').select('*', { count: 'exact', head: true }).eq('class_id', AppState.currentProfile.class_id),
        supabase.from('attendance').select('status').eq('class_id', AppState.currentProfile.class_id).eq('date', today),
        supabase.from('attendance').select('status').eq('class_id', AppState.currentProfile.class_id).gte('date', monthStartStr)
      ]).then(([studentRes, todayAttRes, monthAttRes]) => {
        const totalStudents = studentRes.count || 0;
        const todayAtt = todayAttRes.data || [];
        const monthAtt = monthAttRes.data || [];
        if (totalStudents > 0 && todayAtt.length > 0) {
          const present = todayAtt.filter(a => a.status === 'present' || a.status === 'late').length;
          document.getElementById('att-today-rate').textContent = Math.round((present / totalStudents) * 100) + '%';
        } else document.getElementById('att-today-rate').textContent = '-';
        if (monthAtt.length > 0) {
          const presentRecords = monthAtt.filter(a => a.status === 'present' || a.status === 'late').length;
          document.getElementById('att-month-rate').textContent = Math.round((presentRecords / monthAtt.length) * 100) + '%';
          document.getElementById('att-absent-count').textContent = monthAtt.filter(a => a.status === 'absent').length;
          document.getElementById('att-leave-count').textContent = monthAtt.filter(a => a.status === 'leave').length;
        }
      });
    }

    function publishPost() {
      const content = document.getElementById('post-content').value.trim();
      const category = document.getElementById('post-category').value;
      const imagesInput = document.getElementById('post-images-input');
      if (!content && imagesInput.files.length === 0) { showToast('请输入内容或选择图片', 'error'); return; }
      let imageUrls = [];
      const uploadPromises = [];
      if (imagesInput.files.length > 0) {
        for (const file of imagesInput.files) {
          uploadPromises.push(compressImage(file, 1200, 0.7).then(compressed => {
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2,6)}.jpg`;
            return supabase.storage.from('post-images').upload(fileName, compressed).then(() => {
              const { data: urlData } = supabase.storage.from('post-images').getPublicUrl(fileName);
              return urlData.publicUrl;
            });
          }));
        }
      }
      Promise.all(uploadPromises).then(async (urls) => {
        imageUrls = urls;
        const { error } = await supabase.from('posts').insert({
          class_id: AppState.currentProfile.class_id,
          teacher_id: AppState.currentUser.id,
          content: content || null,
          category,
          images: imageUrls.length > 0 ? imageUrls.join(',') : null
        });
        if (error) { showToast('发布失败', 'error'); return; }
        document.getElementById('post-content').value = ''; imagesInput.value = '';
        showToast('发布成功', 'success'); loadMoments();
      });
    }

    function loadInsightsData() {
      supabase.from('students').select('*', { count: 'exact', head: true }).eq('class_id', AppState.currentProfile.class_id).then(({ count }) => {
        document.getElementById('insight-total-students').textContent = count || 0;
      });
      supabase.from('exams').select('*').eq('class_id', AppState.currentProfile.class_id).order('exam_date', { ascending: true }).then(async ({ data: exams }) => {
        if (exams && exams.length > 0) {
          const labels = exams.map(e => e.exam_name);
          const avgScores = [];
          for (const exam of exams) {
            const { data: grades } = await supabase.from('exam_scores').select('score').eq('exam_id', exam.id);
            avgScores.push(grades.length > 0 ? grades.reduce((sum, g) => sum + parseFloat(g.score), 0) / grades.length : null);
          }
          const ctx = document.getElementById('insight-chart').getContext('2d');
          new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: '班级均分', data: avgScores, borderColor: '#6d5dfc', backgroundColor: 'rgba(109,93,252,0.1)', tension: 0.3, fill: true }] }, options: { responsive: true, scales: { y: { beginAtZero: false } }, plugins: { legend: { labels: { color: '#e2e8f0' } } } } });
          const latestAvg = avgScores[avgScores.length - 1];
          if (latestAvg) document.getElementById('insight-avg-score').textContent = latestAvg.toFixed(1);
        }
      });
      const monthStart = new Date(); monthStart.setDate(1);
      supabase.from('attendance').select('status').eq('class_id', AppState.currentProfile.class_id).gte('date', monthStart.toISOString().split('T')[0]).then(({ data }) => {
        if (data && data.length > 0) {
          const present = data.filter(a => a.status === 'present' || a.status === 'late').length;
          document.getElementById('insight-attendance-rate').textContent = Math.round((present / data.length) * 100) + '%';
        }
      });
    }

      container.innerHTML = `<div class="page-header"><h2>用户管理</h2></div><div class="card"><div id="users-list" class="empty-state"><i class="fa-solid fa-user-shield"></i><p>加载中...</p></div></div>`;
      supabase.from('profiles').select('*').order('created_at', { ascending: true }).then(({ data }) => {
        const list = document.getElementById('users-list');
        if (!data || data.length === 0) { list.innerHTML = '<i class="fa-solid fa-user-shield"></i><p>暂无用户</p>'; return; }
        list.innerHTML = data.map(u => `<div style="background:rgba(255,255,255,0.05);border-radius:6px;padding:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;"><div><strong>${escapeHtml(u.username)}</strong> <span style="font-size:11px;color:var(--text-secondary);">${escapeHtml(u.realname || '')}</span> <span class="badge ${u.is_active ? 'badge-success' : 'badge-danger'}">${u.is_active ? '启用' : '禁用'}</span></div><div><select class="role-select" data-id="${u.id}" style="padding:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;"><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>管理员</option><option value="class_teacher" ${u.role === 'class_teacher' ? 'selected' : ''}>班主任</option><option value="subject_teacher" ${u.role === 'subject_teacher' ? 'selected' : ''}>科任教师</option></select> <button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-success'} toggle-user" data-id="${u.id}" data-active="${u.is_active}">${u.is_active ? '禁用' : '启用'}</button></div></div>`).join('');
        list.querySelectorAll('.role-select').forEach(sel => sel.addEventListener('change', async (e) => { await supabase.from('profiles').update({ role: e.target.value }).eq('id', e.target.dataset.id); showToast('角色已更新', 'success'); }));
        list.querySelectorAll('.toggle-user').forEach(btn => btn.addEventListener('click', async (e) => {
          if (e.currentTarget.dataset.id === AppState.currentUser.id) { showToast('不能禁用自己', 'error'); return; }
          await supabase.from('profiles').update({ is_active: !(e.currentTarget.dataset.active === 'true') }).eq('id', e.currentTarget.dataset.id);
          showToast('状态已更新', 'success'); loadUsers();
        }));
      });
    }
  </script>
</body>
</html>
